<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conceitos · rodada 11 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 11 — conceitos, não variações

   Paleta Marca travada (azul-noite e dourado) para a comparação
   ser sobre ESTRUTURA. Cinco respostas diferentes para a mesma
   pergunta: para que serve esta tela?

   X1  para abrir sistemas     → o que você escolheu
   X2  para saber o que fazer  → pendências no centro, sistemas na borda
   X3  para ver o setor        → uma coluna por setor, como quadro de obra
   X4  para tudo igual         → quatro quadrantes de mesmo peso
   X5  para começar do zero    → uma caixa de busca no meio e nada mais

   Não há resposta certa. Há a que combina com o que a equipe
   realmente faz ao abrir o navegador de manhã.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#f3f5f9; --papel:#fff; --realce:#f3f5f9; --fio:#e4e9f1; --fio-2:#cfd8e4;
  --txt:#0d1926; --txt-2:#4c5f78; --txt-3:#7f92aa;
  --nav:#0d1926; --nav-txt:#93a8c4;
  --acento:#c2a250; --acento-esc:#87681c; --acento-txt:#1a1204;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e;color:var(--txt)}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#5c7093;margin-left:auto}

.modelo{display:none}
.modelo.ativo{display:block}
.tela{height:calc(100vh - 47px);overflow:hidden;background:var(--base);display:grid}

/* ---------- peças partilhadas ---------- */
.rot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.17em;
     text-transform:uppercase;color:var(--txt-3)}
.ico{border-radius:12px;background:#fff;border:1px solid var(--fio);display:grid;place-items:center;
     overflow:hidden;flex:none;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.ico img{object-fit:contain}
.ico--sigla{background:var(--acento);color:var(--acento-txt);font-weight:780;border:0}

.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
     padding:7px 3px;border-radius:11px;transition:background .14s}
.app:hover{background:var(--realce)}
.app:hover .ico{transform:translateY(-3px)}
.app .ico{width:42px;height:42px}
.app .ico img{width:28px;height:28px}
.app .ico--sigla{font-size:13px}
.app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}

.fila{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;transition:background .14s}
.fila:hover{background:var(--realce)}
.fila .ico{width:26px;height:26px;border-radius:8px}
.fila .ico img{width:17px;height:17px}
.fila .ico--sigla{font-size:9.5px}
.fila__n{font-size:12.5px;font-weight:600;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pen{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--papel);
     border:1px solid var(--fio);align-items:flex-start;margin-bottom:7px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--acento)}
.pen__p{flex:none;width:38px;text-align:center}
.pen__d{font-family:var(--mono);font-size:17px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--acento-esc)}
.pen__o{font-size:13px;font-weight:640;line-height:1.35}
.pen__q{font-size:11px;color:var(--txt-3);margin-top:3px}
.pen--grande{padding:16px}
.pen--grande .pen__o{font-size:15px}
.pen--grande .pen__d{font-size:22px}
.pen--grande .pen__p{width:46px}

.aviso{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:var(--papel);
       border:1px solid var(--fio);margin-bottom:6px;align-items:flex-start}
.aviso__p{width:6px;height:6px;border-radius:50%;background:var(--acento);flex:none;margin-top:5px}
.aviso__t{font-size:12.5px;font-weight:660}
.aviso__x{font-size:11.5px;color:var(--txt-2);margin-top:2px}

.prazo{background:var(--papel);border:1px solid var(--fio);border-radius:10px;padding:10px 11px;
       border-left:3px solid var(--fio-2)}
.prazo--perto{border-left-color:var(--acento)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:18px;font-weight:730;line-height:1}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--acento-esc)}
.prazo__n{font-size:10.5px;font-weight:620;color:var(--txt-2);margin-top:5px;line-height:1.3}
.prazo__q{font-size:9.5px;color:var(--txt-3);margin-top:2px}

.cab{display:flex;align-items:center;gap:18px;padding:12px 24px;
     border-bottom:1px solid var(--fio);background:var(--papel)}
.marca{height:38px;width:auto}
.rel{margin-left:auto;display:flex;align-items:center;gap:13px}
.rel__h{font-family:var(--mono);font-size:17px;font-weight:680;color:var(--txt)}
.rel__d{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.rel__risco{width:1px;height:28px;background:var(--fio)}
.rel__ola{font-size:14px;font-weight:640}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta)}

.bloco{background:var(--papel);border:1px solid var(--fio);border-radius:14px;padding:15px 17px;
       display:flex;flex-direction:column;min-height:0}
.bloco__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bloco__t{font-size:14px;font-weight:730}
.bloco__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}
.rolo{overflow:auto;min-height:0;flex:1}

/* ============================================================
   X1 · TRILHO — o que você escolheu, para comparar
   ============================================================ */
#X1 .tela{grid-template-columns:64px 1fr 400px;grid-template-rows:auto 1fr}
#X1 .nav{grid-row:1/-1;grid-column:1;background:var(--nav);display:flex;flex-direction:column;
         align-items:center;gap:5px;padding:14px 0}
#X1 .cab{grid-column:2/-1}
#X1 .centro{grid-column:2;grid-row:2;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
#X1 .lado{grid-column:3;grid-row:2;overflow:auto;padding:18px 20px;background:var(--papel);
          border-left:1px solid var(--fio)}
#X1 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:13px 6px}
#X1 .agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}

.nav__logo{width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s,color .14s}
.nav__b:hover{background:rgba(255,255,255,.10);color:#fff}
.nav__b.on{background:var(--acento);color:var(--acento-txt)}
.nav__b svg{width:19px;height:19px}

/* ============================================================
   X2 · TRABALHO PRIMEIRO
   As pendências ocupam o centro da tela, grandes. Os sistemas
   viram uma barra de ícones no alto — presentes, mas do
   tamanho de uma ferramenta, não de um destino. Parte de uma
   ideia: a equipe não abre o navegador para "ver sistemas",
   abre para trabalhar.
   ============================================================ */
#X2 .tela{grid-template-rows:auto auto 1fr}
#X2 .barra{display:flex;align-items:center;gap:4px;padding:10px 24px;background:var(--papel);
           border-bottom:1px solid var(--fio);overflow:auto}
#X2 .barra .ico{width:34px;height:34px;border-radius:10px}
#X2 .barra .ico img{width:22px;height:22px}
#X2 .barra .ico--sigla{font-size:11px}
#X2 .atalho{padding:5px;border-radius:10px;transition:background .14s;flex:none}
#X2 .atalho:hover{background:var(--realce)}
#X2 .barra__mais{margin-left:8px;padding:7px 13px;border-radius:99px;background:var(--realce);
                 font-size:12px;font-weight:620;color:var(--txt-2);white-space:nowrap;flex:none}
#X2 .miolo{display:grid;grid-template-columns:1fr 330px;gap:16px;padding:18px 24px;overflow:hidden}
#X2 .col{display:flex;flex-direction:column;gap:12px;min-height:0}

/* ============================================================
   X3 · QUADRO DE SETORES
   Uma coluna por setor da casa. Em cada uma, o que aquele setor
   deve e o que ele está esperando. É a tela de quem coordena —
   dá para ver em dois segundos qual setor está afogado.
   ============================================================ */
#X3 .tela{grid-template-rows:auto 1fr}
#X3 .quadro{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;
            padding:18px 24px;overflow:auto}
#X3 .coluna{display:flex;flex-direction:column;min-height:0}
#X3 .coluna__cab{display:flex;align-items:center;gap:9px;padding:0 3px 10px}
#X3 .coluna__t{font-size:13px;font-weight:700}
#X3 .coluna__n{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;
               background:var(--realce);border:1px solid var(--fio);border-radius:99px;padding:2px 9px;color:var(--txt-2)}
#X3 .coluna__n--quente{background:#fdeceb;border-color:#f0cac6;color:var(--alerta)}
#X3 .coluna__rolo{overflow:auto;min-height:0;flex:1;padding-right:2px}
#X3 .pen{padding:11px;margin-bottom:6px}
#X3 .pen__o{font-size:12.5px}

/* ============================================================
   X4 · QUATRO QUADRANTES
   Sistemas, pendências, agenda e avisos com exatamente o mesmo
   peso, dois por dois. Ninguém manda em ninguém. É o mais
   simétrico e o mais fácil de aprender — e também o que menos
   diz o que é prioridade.
   ============================================================ */
#X4 .tela{grid-template-rows:auto 1fr}
#X4 .quatro{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
            gap:12px;padding:16px 24px;overflow:hidden}
#X4 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 5px;align-content:start}
#X4 .agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;align-content:start}

/* ============================================================
   X5 · COMEÇA COM UMA PERGUNTA
   Uma caixa no meio da tela, como a página inicial de um
   navegador. Digite o nome do sistema e vá. Embaixo, só o que
   você marcou como seu. As pendências ficam numa faixa discreta
   no alto. A aposta mais radical: quase nada na tela.
   ============================================================ */
#X5 .tela{grid-template-rows:auto auto 1fr;background:var(--papel)}
#X5 .faixa-pen{display:flex;align-items:center;gap:16px;padding:10px 24px;
               background:var(--nav);color:#e9eef7;overflow:auto}
#X5 .fp__t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
           color:var(--acento);white-space:nowrap;flex:none}
#X5 .fp__i{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;flex:none}
#X5 .fp__d{font-family:var(--mono);font-weight:700;color:var(--acento)}
#X5 .fp__d--atraso{color:#ff8a7e}
#X5 .fp__sep{width:1px;height:16px;background:rgba(255,255,255,.16);flex:none}
#X5 .centro{display:grid;place-items:center;padding:20px;overflow:auto}
#X5 .caixa{width:100%;max-width:620px;text-align:center}
#X5 .ola{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
#X5 .sub{font-size:13.5px;color:var(--txt-3);margin-bottom:22px}
#X5 .busca{display:flex;align-items:center;gap:12px;background:var(--base);border:1px solid var(--fio);
           border-radius:14px;padding:14px 18px;margin-bottom:26px}
#X5 .busca input{border:0;outline:0;background:none;flex:1;font-size:15px;color:var(--txt)}
#X5 .busca svg{width:18px;height:18px;color:var(--txt-3);flex:none}
#X5 .favoritos{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:12px 4px;
               max-width:620px;margin:0 auto}
#X5 .resultados{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;text-align:left}
#X5 .res{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
         background:var(--base);border:1px solid var(--fio)}
#X5 .res .ico{width:26px;height:26px;border-radius:8px}
#X5 .res .ico img{width:17px;height:17px}
#X5 .res .ico--sigla{font-size:9.5px}
#X5 .res__n{font-size:12.5px;font-weight:620}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Conceitos</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Paleta Marca fixa · muda a ideia da tela</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos11.js"></script>
</body>
</html>
