<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos visuais · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   PÁGINA DE ESCOLHA — não faz parte do Hub.
   Quatro direções visuais, com os sistemas reais dentro, para
   comparar clicando. Depois da escolha, esta página sai.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:#0a0f1a;color:#e8eef7;min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

/* ---------- Barra de escolha ---------- */
.escolha{position:sticky;top:0;z-index:100;background:#060a12;border-bottom:1px solid #1c2740;
         padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.escolha__titulo{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8296b4}
.escolha__botoes{display:flex;gap:7px;flex-wrap:wrap}
.opcao{padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:620;
       background:#111a2b;border:1px solid #22304d;color:#a9bcd8;transition:all .16s}
.opcao:hover{background:#17233a;color:#e8eef7}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#1a1204}
.escolha__nota{font-size:12.5px;color:#6f83a3;margin-left:auto}

.palco{padding:0}
.modelo{display:none}
.modelo.ativo{display:block}

.rotulo{padding:16px 34px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.rotulo span{opacity:.55;font-weight:500;letter-spacing:0;text-transform:none;font-size:13px;margin-left:10px}

/* ============================================================
   A · BENTO ESCURO
   Blocos de tamanhos diferentes. O que se usa todo dia ocupa
   bloco grande; o resto encolhe. Separação por elevação e cor
   de superfície, não por moldura — é o que tira a cara de lista.
   ============================================================ */
#A{background:#0a0f1a;padding:22px 34px 40px}
#A .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
#A .logo{height:44px;width:auto}
#A .hora{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#93a8c8}
#A .hora b{color:#e8eef7;font-weight:640}

#A .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
#A .bloco{background:#111a2b;border-radius:18px;padding:18px;position:relative;overflow:hidden;
          box-shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 12px 30px rgba(0,0,0,.32)}
#A .bloco--principal{grid-column:span 5;background:linear-gradient(150deg,#16233c 0%,#101a2c 62%)}
#A .bloco--nossos{grid-column:span 4}
#A .bloco--dia{grid-column:span 3}
#A .bloco--gavetas{grid-column:span 8}
#A .bloco--recados{grid-column:span 4}

#A .bloco__titulo{font-size:11.5px;font-weight:730;letter-spacing:.1em;text-transform:uppercase;
                  color:#7d93b5;margin-bottom:14px;display:flex;align-items:center;gap:8px}
#A .bloco__titulo::before{content:"";width:5px;height:5px;border-radius:50%;background:#e0b44c}

#A .apps{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#A .bloco--dia .apps{grid-template-columns:1fr}
#A .app{display:flex;align-items:center;gap:11px;padding:10px;border-radius:13px;
        background:#16203440;transition:background .16s,transform .16s}
#A .app:hover{background:#1d2b45;transform:translateY(-2px)}
#A .app__icone{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;
               flex:none;overflow:hidden}
#A .app__icone img{width:24px;height:24px;object-fit:contain}
#A .app__icone--sigla{background:#e0b44c;color:#1a1204;font-weight:750;font-size:12px}
#A .app__nome{font-size:13.5px;font-weight:600;color:#e8eef7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#A .app__nota{font-size:11px;color:#7d93b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#A .gaveta{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
           background:#16203440;margin-bottom:7px;transition:background .16s}
#A .gaveta:hover{background:#1d2b45}
#A .gaveta__nome{font-size:13.5px;font-weight:600}
#A .gaveta__conta{margin-left:auto;font-size:11.5px;font-weight:700;color:#e0b44c;
                  background:#e0b44c1f;padding:2px 9px;border-radius:99px}
#A .recado{display:flex;gap:10px;margin-bottom:14px}
#A .recado__ponto{width:7px;height:7px;border-radius:50%;background:#e0b44c;margin-top:6px;flex:none}
#A .recado__t{font-size:13.5px;font-weight:620}
#A .recado__x{font-size:12.5px;color:#8fa4c4}

/* ============================================================
   B · VIDRO
   Fundo com luz colorida ao fundo e cartões de vidro fosco por
   cima. É a linguagem "liquid glass" que virou marca de produto
   de tecnologia em 2026.
   ============================================================ */
#B{position:relative;padding:22px 34px 40px;background:#070b14;overflow:hidden;min-height:100vh}
#B::before{content:"";position:absolute;inset:-30%;z-index:0;
  background:
    radial-gradient(44% 46% at 16% 20%, rgba(224,180,76,.55), transparent 62%),
    radial-gradient(48% 50% at 84% 14%, rgba(52,124,255,.60), transparent 62%),
    radial-gradient(52% 54% at 60% 92%, rgba(132,84,255,.52), transparent 62%);
  filter:blur(10px)}
#B > *{position:relative;z-index:1}
#B .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
#B .logo{height:44px;width:auto}
#B .hora{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#c3d2ea}
#B .secao{margin-bottom:22px}
#B .secao__titulo{font-size:11.5px;font-weight:730;letter-spacing:.1em;text-transform:uppercase;
                  color:#b9c9e4;margin-bottom:12px}
#B .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
#B .app{display:flex;align-items:center;gap:12px;padding:14px;border-radius:17px;
        background:rgba(255,255,255,.07);
        -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
        border:1px solid rgba(255,255,255,.13);
        box-shadow:0 8px 32px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18);
        transition:transform .18s,background .18s}
#B .app:hover{transform:translateY(-3px);background:rgba(255,255,255,.12)}
#B .app__icone{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.92);
               display:grid;place-items:center;flex:none;overflow:hidden}
#B .app__icone img{width:25px;height:25px;object-fit:contain}
#B .app__icone--sigla{background:rgba(224,180,76,.9);color:#1a1204;font-weight:750;font-size:12px}
#B .app__nome{font-size:14px;font-weight:620;color:#fff}
#B .app__nota{font-size:11.5px;color:#c3d2ea}
#B .gavetas{display:flex;flex-wrap:wrap;gap:9px}
#B .gaveta{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:99px;
           background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
           -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:13px;font-weight:600}
#B .gaveta__conta{color:#f0cf87;font-weight:730}

/* ============================================================
   C · LANÇADOR
   Sem cartão nenhum: ícone grande, nome embaixo, como a tela
   inicial de um celular. É o mais distante possível de lista —
   a marca de cada sistema é que faz o reconhecimento, e o olho
   acha por cor e forma antes de ler.
   ============================================================ */
#C{background:radial-gradient(120% 90% at 50% 0%, #142138 0%, #080d16 68%);padding:26px 34px 44px;min-height:100vh}
#C .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
#C .logo{height:46px;width:auto}
#C .hora{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#8fa5c6}
#C .secao{margin-bottom:30px}
#C .secao__titulo{font-size:11.5px;font-weight:730;letter-spacing:.11em;text-transform:uppercase;
                  color:#71879f;margin-bottom:18px}
#C .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 12px}
#C .app{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
#C .app__icone{width:62px;height:62px;border-radius:19px;background:#fff;display:grid;place-items:center;
               overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.42);
               transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s}
#C .app:hover .app__icone{transform:translateY(-6px) scale(1.06);box-shadow:0 18px 38px rgba(0,0,0,.55)}
#C .app__icone img{width:40px;height:40px;object-fit:contain}
#C .app__icone--sigla{background:linear-gradient(145deg,#e0b44c,#b98a2a);color:#1a1204;font-weight:780;font-size:19px}
#C .app__nome{font-size:12.5px;font-weight:600;color:#dbe6f5;line-height:1.3}
#C .gavetas{display:flex;flex-wrap:wrap;gap:9px}
#C .gaveta{padding:9px 15px;border-radius:11px;background:#16223a;font-size:12.5px;font-weight:600;color:#b3c6e0}
#C .gaveta__conta{color:#e0b44c;margin-left:7px;font-weight:730}

/* ============================================================
   D · CLARO TECNOLÓGICO
   Continua claro, mas sem moldura nenhuma: a superfície é um
   tom de cinza-azulado levemente diferente do fundo, e quem
   separa é a cor, não o fio. Sombra colorida na passagem do
   mouse. Para quem prefere tela clara e ainda quer ar de
   produto de tecnologia.
   ============================================================ */
#D{background:#f2f5fa;color:#101a2b;padding:22px 34px 40px;min-height:100vh}
#D .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
#D .logo{height:44px;width:auto}
#D .hora{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:#5b6f8c}
#D .secao{margin-bottom:24px}
#D .secao__titulo{font-size:11.5px;font-weight:730;letter-spacing:.1em;text-transform:uppercase;
                  color:#5b6f8c;margin-bottom:13px}
#D .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:11px}
#D .app{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#fff;
        box-shadow:0 1px 2px rgba(16,26,43,.05);transition:transform .18s,box-shadow .18s}
#D .app:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(21,50,102,.16)}
#D .app__icone{width:38px;height:38px;border-radius:11px;background:#f2f5fa;display:grid;place-items:center;
               flex:none;overflow:hidden}
#D .app__icone img{width:25px;height:25px;object-fit:contain}
#D .app__icone--sigla{background:linear-gradient(145deg,#16294a,#0d1a2e);color:#e0b44c;font-weight:750;font-size:12px}
#D .app__nome{font-size:14px;font-weight:640}
#D .app__nota{font-size:11.5px;color:#5b6f8c}
#D .gavetas{display:flex;flex-wrap:wrap;gap:9px}
#D .gaveta{padding:10px 16px;border-radius:99px;background:#fff;font-size:13px;font-weight:600;
           box-shadow:0 1px 2px rgba(16,26,43,.05)}
#D .gaveta__conta{color:#96762b;margin-left:7px;font-weight:730}
#D .primeiro{background:linear-gradient(135deg,#16294a,#0d1a2e);color:#fff;border-radius:20px;padding:20px;margin-bottom:24px}
#D .primeiro .secao__titulo{color:#9fb4d6}
#D .primeiro .app{background:rgba(255,255,255,.08)}
#D .primeiro .app__nome{color:#fff}
#D .primeiro .app__nota{color:#9fb4d6}
#D .primeiro .app:hover{background:rgba(255,255,255,.14);box-shadow:none}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__titulo">Modelos</span>
  <div class="escolha__botoes" id="botoes"></div>
  <span class="escolha__nota">Os sistemas são os seus, de verdade. Clique para comparar.</span>
</div>

<div class="palco" id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos.js"></script>
</body>
</html>
