<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organização dos sistemas · rodada 7 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 7 — organização dos sistemas

   O quadro (Trilho largo, com pendências e avisos à direita)
   está fechado. Varia só a área dos aplicativos.

   O QUE A PESQUISA MUDOU NO MEU RACIOCÍNIO

   1. O problema nunca foi a quantidade, foi o agrupamento.
      Agrupado, o olho varre "quatro grupos de cinco" em vez de
      "vinte links soltos" — e o custo de decidir cai junto.

   2. Largo vence profundo. Escolher uma vez num menu de oito é
      mais rápido que escolher duas vezes em dois menus de
      quatro. Então nada de esconder atrás de clique.

   3. A lentidão vem de rótulo vago e grupo mal feito. Se a
      pessoa precisa ESTUDAR a estrutura, o agrupamento já
      perdeu a função.

   4. E o meu erro, que a pesquisa deixou claro: agrupei por
      DEPARTAMENTO — Fiscal, Pessoal, Legalização. Isso é como a
      empresa se organiza, não como a cabeça de quem vai clicar
      funciona. Ninguém pensa "preciso de um sistema do setor
      fiscal"; pensa "preciso emitir uma guia". Metade dos
      modelos abaixo reagrupa POR TAREFA para você comparar as
      duas lógicas lado a lado.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#eef1f6; --zona:#ffffff;
  --fio:#dfe5ee; --fio-2:#cdd6e3;
  --navy:#101a2b;
  --txt:#101a2b; --txt-2:#4a5d78; --txt-3:#78899f;
  --ouro:#96762b; --ouro-luz:#f6efdd; --ouro-vivo:#c99a2e;
  --alerta:#c0453a; --alerta-luz:#fdeceb;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:var(--base);color:var(--txt);min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#0c1420;border-bottom:1px solid #1d2839;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#132033;border:1px solid #22304a;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#1a2b42;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#657ba0;margin-left:auto}

.modelo{display:none;min-height:100vh}
.modelo.ativo{display:block}

/* ---------- quadro fixo: cabeçalho + trilho largo ---------- */
.cab{display:flex;align-items:center;gap:20px;padding:18px 34px}
.marca__img{height:52px;width:auto}
.agora{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none;
       background:var(--zona);border-radius:14px;padding:10px 18px}
.agora__hora{font-family:ui-monospace,Consolas,monospace;font-size:23px;font-weight:700;
             line-height:1;color:var(--navy);letter-spacing:-.02em}
.agora__data{font-size:11.5px;color:var(--txt-3);margin-top:4px}
.agora__risco{width:1px;align-self:stretch;background:var(--fio)}
.agora__ola{font-size:15px;font-weight:640;color:var(--navy);line-height:1.2}
.agora__nota{font-size:11.5px;color:var(--txt-2);margin-top:3px}
.agora__nota b{color:var(--alerta);font-weight:700}

.corpo{display:grid;grid-template-columns:1fr 420px;align-items:start}
.area{padding:6px 30px 40px;min-width:0}
.trilho{background:var(--base);border-left:1px solid var(--fio);padding:22px 26px;
        min-height:calc(100vh - 96px)}

.zona__cab{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.zona__t{font-size:16px;font-weight:730;color:var(--navy)}
.zona__n{font-size:12.5px;color:var(--txt-3)}
.zona__n b{color:var(--alerta)}
.pen{display:flex;gap:14px;padding:14px;border-radius:13px;background:var(--zona);
     align-items:flex-start;margin-bottom:8px}
.pen__faixa{width:4px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__faixa{background:var(--alerta)}
.pen--hoje .pen__faixa{background:var(--ouro-vivo)}
.pen__prazo{flex:none;width:44px;text-align:center}
.pen__dia{font-family:ui-monospace,Consolas,monospace;font-size:19px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__mes{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__dia{color:var(--alerta)}
.pen--hoje .pen__dia{color:var(--ouro)}
.pen__oque{font-size:14px;font-weight:640;line-height:1.35}
.pen__quem{font-size:12px;color:var(--txt-3);margin-top:4px}
.pen__sel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          padding:3px 9px;border-radius:99px;margin-left:auto;flex:none;white-space:nowrap}
.pen--atrasada .pen__sel{background:var(--alerta-luz);color:var(--alerta)}
.pen--hoje .pen__sel{background:var(--ouro-luz);color:var(--ouro)}
.aviso{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:var(--zona);
       margin-bottom:7px;align-items:flex-start}
.aviso__p{width:7px;height:7px;border-radius:50%;background:var(--ouro-vivo);flex:none;margin-top:5px}
.aviso__t{font-size:13px;font-weight:660;color:var(--navy)}
.aviso__x{font-size:12px;color:var(--txt-2);margin-top:2px}

/* ---------- peças comuns dos aplicativos ---------- */
.rot{font-size:10.5px;font-weight:730;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.ico{border-radius:10px;background:#fff;border:1px solid var(--fio);display:grid;place-items:center;
     overflow:hidden;flex:none}
.ico img{object-fit:contain}
.ico--sigla{background:linear-gradient(150deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780;border:0}

/* ============================================================
   A · COLEÇÕES POR TAREFA
   Cinco grupos com nome de trabalho, não de departamento. Cada
   grupo é um quadro branco de altura igual, e os ícones dentro
   ficam numa grade de colunas fixas — o alinhamento que faltava.
   ============================================================ */
#A .quadros{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
#A .quadro{background:var(--zona);border-radius:16px;padding:16px 18px}
#A .quadro__rot{margin-bottom:4px}
#A .quadro__sub{font-size:11.5px;color:var(--txt-3);margin-bottom:13px}
#A .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px 4px}
#A .app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
        padding:5px 2px;border-radius:10px;transition:background .14s}
#A .app:hover{background:var(--base)}
#A .ico{width:36px;height:36px;border-radius:11px}
#A .ico img{width:24px;height:24px}
#A .ico--sigla{font-size:12px}
#A .app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}

/* ============================================================
   B · FILA DE HOJE + ARMÁRIO
   Os oito de todo dia numa fila larga, com nome e legenda. Todo
   o resto vira "armário": quatro colunas de texto miúdo, sem
   ícone grande, porque quem procura ali já sabe o nome do que
   quer. Dá peso a quem merece e não esconde ninguém.
   ============================================================ */
#B .fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:26px}
#B .destaque{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
             background:var(--zona);transition:transform .15s,box-shadow .15s}
#B .destaque:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,26,43,.11)}
#B .ico{width:34px;height:34px}
#B .ico img{width:23px;height:23px}
#B .ico--sigla{font-size:11.5px}
#B .destaque__n{font-size:13px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#B .armario{background:var(--zona);border-radius:16px;padding:18px 20px}
#B .colunas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:22px;margin-top:14px}
#B .col__rot{margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--fio)}
#B .linha{display:block;font-size:12.5px;font-weight:580;color:var(--txt-2);padding:5px 0;
          transition:color .14s}
#B .linha:hover{color:var(--navy)}

/* ============================================================
   C · MENU DE RESTAURANTE
   Duas colunas largas, e dentro delas os grupos empilhados como
   as seções de um cardápio: título com fio, itens em linha, um
   embaixo do outro. Densidade alta e leitura fácil — cardápio é
   o objeto mais testado que existe para escolher rápido numa
   lista grande.
   ============================================================ */
#C .cardapio{columns:2;column-gap:34px}
#C .secao{break-inside:avoid;margin-bottom:24px}
#C .secao__rot{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
#C .secao__rot::after{content:"";flex:1;height:1px;background:var(--fio)}
#C .linha{display:flex;align-items:center;gap:10px;padding:6px 7px;border-radius:8px;transition:background .14s}
#C .linha:hover{background:var(--zona)}
#C .ico{width:24px;height:24px;border-radius:7px}
#C .ico img{width:16px;height:16px}
#C .ico--sigla{font-size:9px}
#C .linha__n{font-size:13px;font-weight:600;color:var(--txt-2)}
#C .linha:hover .linha__n{color:var(--navy)}

/* ============================================================
   D · UMA GRADE SÓ, COM FILTRO
   Sem grupo nenhum na tela: todos os sistemas numa grade única,
   e uma fileira de filtros em cima. Quem sabe o nome, digita;
   quem quer navegar, filtra. Resolve de vez o "em que setor
   será que isso mora", que é onde esse tipo de tela falha.
   ============================================================ */
#D .barra{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
#D .busca{display:flex;align-items:center;gap:9px;background:var(--zona);border-radius:11px;
          padding:10px 14px;flex:1;min-width:220px;max-width:340px}
#D .busca input{border:0;outline:0;background:none;flex:1;font-size:13.5px;color:var(--txt)}
#D .busca svg{width:15px;height:15px;color:var(--txt-3);flex:none}
#D .filtro{padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:620;color:var(--txt-2);
           background:var(--zona);transition:all .14s}
#D .filtro:hover{color:var(--navy)}
#D .filtro.on{background:var(--navy);color:#fff}
#D .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:16px 6px}
#D .app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
        padding:8px 3px;border-radius:12px;transition:background .14s}
#D .app:hover{background:var(--zona)}
#D .ico{width:42px;height:42px;border-radius:13px}
#D .ico img{width:28px;height:28px}
#D .ico--sigla{font-size:14px}
#D .app__n{font-size:11px;font-weight:600;color:var(--txt-2);line-height:1.25}
#D .nada{padding:30px;text-align:center;color:var(--txt-3);font-size:13px}

/* ============================================================
   E · POR TAREFA, EM LINHAS LARGAS
   O mesmo reagrupamento por tarefa do A, mas cada grupo é uma
   faixa horizontal de largura inteira: rótulo à esquerda, fila
   de ícones à direita. Todos os grupos começam na mesma linha
   vertical e nenhum fica com "buraco" no fim.
   ============================================================ */
#E .faixa{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start;
          background:var(--zona);border-radius:14px;padding:16px 18px;margin-bottom:10px}
#E .faixa__esq{padding-top:6px}
#E .faixa__sub{font-size:11.5px;color:var(--txt-3);margin-top:5px;line-height:1.4}
#E .fila{display:flex;flex-wrap:wrap;gap:10px 6px}
#E .app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
        width:78px;padding:5px 2px;border-radius:10px;transition:background .14s}
#E .app:hover{background:var(--base)}
#E .ico{width:36px;height:36px;border-radius:11px}
#E .ico img{width:24px;height:24px}
#E .ico--sigla{font-size:12px}
#E .app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 7</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Trilho largo fixo · varia só a área dos sistemas</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos7.js"></script>
</body>
</html>
