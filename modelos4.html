<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos · rodada 4 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 4 — cinco peles para o Trilho

   A estrutura não muda: sistemas na área principal, pendências
   no trilho da direita com fundo próprio, recados numa faixa
   embaixo. Foi essa organização que funcionou, então ela fica
   igual nas cinco. O que muda é só a cor das superfícies.

   Isso é de propósito: comparando cinco peles sobre o MESMO
   esqueleto, a escolha é sobre o que agrada aos olhos, e não
   sobre qual layout organiza melhor — essa parte já foi
   decidida.

   Cada pele é um bloco de variáveis, e nada mais. Se um dia
   quiser trocar de cor, é um bloco desses que muda.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}

/* ---------- 1 · NOITE (a que você aprovou, afinada) ---------- */
.t-noite{
  --base:#0a0e16; --zona:#121a27; --realce:rgba(255,255,255,.05);
  --fio:rgba(255,255,255,.07);
  --txt:#e7edf6; --txt-2:#93a5bf; --txt-3:#6a7d99;
  --ico:#ffffff; --ico-fio:transparent;
  --ouro:#e0b44c; --alerta:#e8776d;
  --logo:url("assets/logo-hub-escuro.png");
}
/* ---------- 2 · CLARO ---------- */
/* Branco no chão, cinza-azulado no trilho. O trilho é a única
   superfície da tela, e é isso que o faz sobressair sem borda. */
.t-claro{
  --base:#ffffff; --zona:#f3f6fa; --realce:#f3f6fa;
  --fio:#e6ebf2;
  --txt:#0e1a2b; --txt-2:#4f637d; --txt-3:#7c8ea6;
  --ico:#ffffff; --ico-fio:#e6ebf2;
  --ouro:#96762b; --alerta:#c0453a;
  --logo:url("assets/logo-hub.png");
}
/* ---------- 3 · CONTRASTE ---------- */
/* Chão branco, trilho azul-noite. A separação mais forte que
   existe sem desenhar nada: o assunto muda porque o lado muda
   de cor por inteiro. */
.t-contraste{
  --base:#ffffff; --zona:#0d1826; --realce:#f4f7fb;
  --fio:#e6ebf2;
  --txt:#0e1a2b; --txt-2:#4f637d; --txt-3:#7c8ea6;
  --ico:#ffffff; --ico-fio:#e6ebf2;
  --ouro:#96762b; --alerta:#c0453a;
  --logo:url("assets/logo-hub.png");
  /* dentro do trilho tudo se inverte */
  --trilho-txt:#eef3fa; --trilho-txt-2:#9db0cb; --trilho-txt-3:#7e93b1;
  --trilho-fio:rgba(255,255,255,.09); --trilho-ouro:#e0b44c; --trilho-alerta:#e8776d;
}
/* ---------- 4 · PAPEL ---------- */
/* Fundo de marfim em vez de branco puro. Branco puro numa tela
   grande cansa a vista tanto quanto preto puro; o marfim baixa
   o brilho sem virar cinza, e o dourado da marca assenta melhor
   sobre ele. */
.t-papel{
  --base:#faf8f3; --zona:#f2ece0; --realce:#f2ece0;
  --fio:#e6ded0;
  --txt:#231d12; --txt-2:#6b5f4c; --txt-3:#8e8272;
  --ico:#ffffff; --ico-fio:#e6ded0;
  --ouro:#8a6a1c; --alerta:#b0402f;
  --logo:url("assets/logo-hub.png");
}
/* ---------- 5 · ARDÓSIA ---------- */
/* O contrário do Claro: o chão é cinza e o trilho é branco. O
   branco vira o destaque, em vez do fundo. */
.t-ardosia{
  --base:#eef1f6; --zona:#ffffff; --realce:#ffffff;
  --fio:#dfe5ee;
  --txt:#101a2b; --txt-2:#4a5d78; --txt-3:#78899f;
  --ico:#ffffff; --ico-fio:#dfe5ee;
  --ouro:#96762b; --alerta:#c0453a;
  --logo:url("assets/logo-hub.png");
}

body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;min-height:100vh;
     background:#05080e}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #17203a;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#0f1724;border:1px solid #1d2839;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#16202e;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#657ba0;margin-left:auto}

/* ============================================================
   O esqueleto — igual nas cinco
   ============================================================ */
.modelo{display:none;min-height:100vh;background:var(--base);color:var(--txt)}
.modelo.ativo{display:block}

.cab{display:flex;align-items:center;gap:20px;padding:20px 40px}
.cab__logo{height:42px;width:190px;background-image:var(--logo);
           background-size:contain;background-repeat:no-repeat;background-position:left center}
.cab__ola{font-size:14.5px;color:var(--txt-2)}
.cab__ola b{color:var(--txt);font-weight:660}
.cab__rel{margin-left:auto;text-align:right}
.cab__hora{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:640}
.cab__data{font-size:12px;color:var(--txt-3)}

.corpo{display:grid;grid-template-columns:1fr 330px;align-items:start}
.area{padding:6px 36px 36px}

.grupo__rot{font-size:10.5px;font-weight:730;letter-spacing:.14em;text-transform:uppercase;
            color:var(--txt-3);margin-bottom:14px}
.grupo + .grupo{margin-top:34px}

.sistemas{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px 6px}
.sis{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
     padding:7px 4px;border-radius:14px;transition:background .15s}
.sis:hover{background:var(--realce)}
.sis__ico{width:46px;height:46px;border-radius:14px;background:var(--ico);
          border:1px solid var(--ico-fio);display:grid;place-items:center;overflow:hidden;flex:none;
          transition:transform .2s cubic-bezier(.16,1,.3,1)}
.sis:hover .sis__ico{transform:translateY(-3px)}
.sis__ico img{width:30px;height:30px;object-fit:contain}
.sis__ico--sigla{background:linear-gradient(150deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780;font-size:15px;border:0}
.sis__nome{font-size:11.5px;font-weight:600;color:var(--txt-2);line-height:1.3}
.sis:hover .sis__nome{color:var(--txt)}

.tira{display:flex;flex-wrap:wrap;gap:6px}
.past{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:99px;
      background:var(--realce);transition:filter .15s}
.past:hover{filter:brightness(.96)}
.t-noite .past:hover{filter:brightness(1.9)}
.past__ico{width:19px;height:19px;border-radius:6px;background:var(--ico);border:1px solid var(--ico-fio);
           display:grid;place-items:center;overflow:hidden;flex:none}
.past__ico img{width:13px;height:13px;object-fit:contain}
.past__ico--sigla{background:var(--ouro);color:#fff;font-weight:780;font-size:7.5px;border:0}
.past__nome{font-size:12px;font-weight:580;color:var(--txt-2);white-space:nowrap}

/* ---------- o trilho ---------- */
.trilho{background:var(--zona);border-radius:18px 0 0 18px;padding:24px;
        min-height:calc(100vh - 82px)}
.trilho__t{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--trilho-txt,var(--txt))}
.trilho__n{font-size:12px;color:var(--trilho-txt-3,var(--txt-3));margin-bottom:16px}

.pen{display:flex;gap:13px;padding:12px 0;align-items:flex-start;
     border-bottom:1px solid var(--trilho-fio,var(--fio))}
.pen:last-child{border-bottom:0}
.pen__prazo{flex:none;width:38px;text-align:center;padding-top:1px}
.pen__dia{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:730;line-height:1;
          color:var(--trilho-txt-2,var(--txt-2))}
.pen__mes{font-size:9px;text-transform:uppercase;letter-spacing:.09em;
          color:var(--trilho-txt-3,var(--txt-3));margin-top:3px}
.pen__oque{font-size:13.5px;font-weight:620;line-height:1.35;color:var(--trilho-txt,var(--txt))}
.pen__quem{font-size:11.5px;color:var(--trilho-txt-3,var(--txt-3));margin-top:3px}
.pen--atrasada .pen__dia{color:var(--trilho-alerta,var(--alerta))}
.pen--hoje .pen__dia{color:var(--trilho-ouro,var(--ouro))}

/* ---------- recados ---------- */
.rodape{border-top:1px solid var(--fio);padding:18px 40px;display:flex;gap:38px;flex-wrap:wrap}
.rec{display:flex;gap:10px;align-items:baseline}
.rec__p{width:6px;height:6px;border-radius:50%;background:var(--ouro);flex:none;position:relative;top:-1px}
.rec__t{font-size:13px;font-weight:620}
.rec__x{font-size:12.5px;color:var(--txt-3)}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 4</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Mesmo esqueleto do Trilho · cinco peles</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos4.js"></script>
</body>
</html>
