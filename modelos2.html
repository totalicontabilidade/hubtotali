<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos · rodada 2 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 2 — quatro caminhos saindo do A e do B.
   Desta vez com o painel de pendências desenhado dentro, porque
   ele muda o equilíbrio da tela: escolher o visual sem ele seria
   escolher uma casa pela fachada, sem saber quantos cômodos vai
   ter.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:#070b14;color:#e9eff8;min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}
ul{margin:0;padding:0;list-style:none}

.escolha{position:sticky;top:0;z-index:100;background:#04070d;border-bottom:1px solid #17203a;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__titulo{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:620;
       background:#101a2c;border:1px solid #202d4a;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#16223a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__nota{font-size:12px;color:#657ba0;margin-left:auto}

.modelo{display:none;padding:22px 30px 44px;min-height:100vh}
.modelo.ativo{display:block}

/* ---------- peças comuns ---------- */
.topo{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.topo__logo{height:44px;width:auto}
.topo__dir{margin-left:auto;text-align:right}
.topo__hora{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:640;color:#eaf1fa}
.topo__data{font-size:12px;color:#7f93b3}
.ola{font-size:14px;color:#a6b9d6}
.ola b{color:#eaf1fa;font-weight:660}

.titulo{font-size:11px;font-weight:730;letter-spacing:.11em;text-transform:uppercase;
        color:#7f93b3;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.titulo__conta{margin-left:auto;font-size:11px;font-weight:700;color:#e0b44c;
               background:rgba(224,180,76,.14);padding:2px 8px;border-radius:99px;letter-spacing:0}

.app__nome{font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app__nota{font-size:11px;color:#7f93b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icone{border-radius:11px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.icone img{object-fit:contain}
.icone--sigla{background:linear-gradient(145deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780}

/* pendência: mesma estrutura nos quatro, muda só a pele */
.pend{display:flex;gap:11px;padding:11px 12px;border-radius:12px;margin-bottom:8px}
.pend__prazo{flex:none;width:42px;text-align:center}
.pend__dia{font-size:16px;font-weight:730;line-height:1;font-family:ui-monospace,Consolas,monospace}
.pend__mes{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#7f93b3}
.pend__oque{font-size:13.5px;font-weight:620;margin-bottom:2px}
.pend__quem{font-size:11.5px;color:#8ea3c4}
.pend__marca{flex:none;width:3px;border-radius:99px;align-self:stretch}
.pend--hoje .pend__marca{background:#e0b44c}
.pend--hoje .pend__dia{color:#e0b44c}
.pend--atrasada .pend__marca{background:#e8776d}
.pend--atrasada .pend__dia{color:#e8776d}
.pend--tranquila .pend__marca{background:#4f9d78}

.gav{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;
     font-size:13px;font-weight:600;margin-bottom:6px}
.gav__conta{margin-left:auto;font-size:11px;font-weight:730;color:#e0b44c}

/* ============================================================
   M1 · BENTO VIDRO — o A com a pele do B
   ============================================================ */
#M1{position:relative;overflow:hidden;background:#070b14}
#M1::before{content:"";position:absolute;inset:-25%;z-index:0;
  background:
    radial-gradient(40% 42% at 12% 8%, rgba(224,180,76,.28), transparent 60%),
    radial-gradient(46% 48% at 88% 12%, rgba(52,110,220,.30), transparent 60%),
    radial-gradient(50% 52% at 55% 96%, rgba(96,72,200,.24), transparent 60%);
  filter:blur(8px)}
#M1 > *{position:relative;z-index:1}
#M1 .bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
#M1 .bloco{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
           -webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
           border-radius:18px;padding:17px;
           box-shadow:0 10px 34px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.14)}
#M1 .b-pend{grid-column:span 5;grid-row:span 2}
#M1 .b-princ{grid-column:span 7}
#M1 .b-nossos{grid-column:span 4}
#M1 .b-dia{grid-column:span 3}
#M1 .b-org{grid-column:span 5}
#M1 .b-rec{grid-column:span 7}
#M1 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#M1 .b-dia .apps{grid-template-columns:1fr}
#M1 .app{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;
         background:rgba(255,255,255,.05);transition:background .16s,transform .16s}
#M1 .app:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
#M1 .icone{width:34px;height:34px}
#M1 .icone img{width:23px;height:23px}
#M1 .icone--sigla{font-size:11.5px}
#M1 .pend{background:rgba(255,255,255,.05)}
#M1 .gav{background:rgba(255,255,255,.05)}

/* ============================================================
   M2 · CENTRO DE COMANDO
   Faixa de números em cima, grade densa embaixo. É a linguagem
   de painel de operação: primeiro o estado das coisas, depois o
   acesso. Quem abre já sabe se o dia está tranquilo.
   ============================================================ */
#M2{background:#080d17}
#M2 .placar{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
#M2 .card{background:#0f1726;border:1px solid #1b2740;border-radius:14px;padding:15px 17px;
          position:relative;overflow:hidden}
#M2 .card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#e0b44c}
#M2 .card--alerta::after{background:#e8776d}
#M2 .card--ok::after{background:#4f9d78}
#M2 .card__n{font-size:27px;font-weight:730;line-height:1;font-family:ui-monospace,Consolas,monospace}
#M2 .card__r{font-size:11.5px;color:#7f93b3;margin-top:5px}
#M2 .colunas{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
#M2 .painel{background:#0f1726;border:1px solid #1b2740;border-radius:16px;padding:16px;margin-bottom:12px}
#M2 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
#M2 .app{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#141f34;
         border-left:2px solid #e0b44c33;transition:border-color .16s,background .16s}
#M2 .app:hover{background:#1a2740;border-left-color:#e0b44c}
#M2 .icone{width:30px;height:30px;border-radius:8px}
#M2 .icone img{width:21px;height:21px}
#M2 .icone--sigla{font-size:11px}
#M2 .pend{background:#141f34}
#M2 .gav{background:#141f34}

/* ============================================================
   M3 · LANÇADOR BENTO
   Blocos como no A, mas dentro deles o sistema é ícone grande,
   sem linha de texto — o reconhecimento vem da marca. As
   pendências ficam numa coluna alta à direita, sempre à vista.
   ============================================================ */
#M3{background:radial-gradient(130% 80% at 50% -10%, #16233c 0%, #070b14 62%)}
#M3 .colunas{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
#M3 .bloco{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
           border-radius:20px;padding:20px;margin-bottom:14px}
#M3 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 10px}
#M3 .app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#M3 .icone{width:54px;height:54px;border-radius:17px;box-shadow:0 8px 22px rgba(0,0,0,.45);
           transition:transform .2s cubic-bezier(.16,1,.3,1)}
#M3 .app:hover .icone{transform:translateY(-5px) scale(1.07)}
#M3 .icone img{width:35px;height:35px}
#M3 .icone--sigla{font-size:17px}
#M3 .app__nome{font-size:11.5px;white-space:normal;line-height:1.3;color:#c9d8ec}
#M3 .pend{background:rgba(255,255,255,.05)}
#M3 .gav{background:rgba(255,255,255,.05)}

/* ============================================================
   M4 · SÓBRIO
   O B com a cor puxada para trás: só azul-noite e dourado, sem
   arco-íris. Menos moda, mais marca — e é o que envelhece
   melhor, porque não depende de uma tendência continuar em alta.
   ============================================================ */
#M4{background:linear-gradient(180deg,#0d1526 0%,#080d17 55%)}
#M4 .faixa{border-radius:22px;padding:22px 24px;margin-bottom:16px;
           background:linear-gradient(135deg,rgba(224,180,76,.16),rgba(224,180,76,.03) 55%),#101a2e;
           border:1px solid rgba(224,180,76,.22)}
#M4 .colunas{display:grid;grid-template-columns:1fr 350px;gap:16px;align-items:start}
#M4 .bloco{background:#101a2e;border:1px solid #1c2942;border-radius:18px;padding:19px;margin-bottom:13px}
#M4 .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#M4 .app{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#16223a;
         transition:background .16s,transform .16s}
#M4 .app:hover{background:#1e2c48;transform:translateY(-2px)}
#M4 .icone{width:38px;height:38px}
#M4 .icone img{width:26px;height:26px}
#M4 .icone--sigla{font-size:12.5px}
#M4 .pend{background:#16223a}
#M4 .gav{background:#16223a}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__titulo">Rodada 2</span>
  <div class="escolha__botoes" id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__nota">Com o painel de pendências desenhado dentro</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos2.js"></script>
</body>
</html>
