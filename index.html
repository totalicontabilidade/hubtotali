<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Nenhum script externo, nenhuma CDN, nenhuma fonte remota. Fora
     da própria pasta o Hub só fala com dois endereços: o banco, de
     onde vem a lista, e o serviço de ícone — este último apenas
     para sistema recém-cadastrado, até alguém rodar
     ferramentas/baixar-logos.js e trazer o ícone para dentro. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self' file:;
  script-src 'self' file:;
  style-src 'self' file:;
  img-src 'self' file: data: https://icons.duckduckgo.com;
  font-src 'self' file:;
  connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<meta name="referrer" content="no-referrer">

<title>Hub Totali</title>
<meta name="description" content="Todos os sistemas da Totali Soluções Contábeis em uma tela só.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1926">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<script src="js/quebra-moldura.js"></script>

<a class="pular" href="#centro">Ir para os sistemas</a>

<!-- O portão. A lista de sistemas da casa deixou de ser pública:
     o banco só a entrega a quem está na equipe, então a tela do
     Hub só aparece depois daqui. Quem entra uma vez continua
     entrando sozinho — o navegador guarda a sessão e ela se
     renova sem pedir nada. -->
<main class="portao" id="portao" hidden>
  <!-- As duas marcas do fundo, sangrando pelas bordas opostas.
       São decoração: por isso div com máscara e não <img> com
       texto alternativo — quem usa leitor de tela não ganha nada
       ouvindo "símbolo" duas vezes antes do campo de e-mail. -->
  <div class="portao__marca portao__marca--totali"></div>
  <div class="portao__marca portao__marca--hub"></div>

  <form class="portao__caixa" id="portao-form" autocomplete="on">
    <img class="portao__logo" src="assets/logo-hub.png" alt="Hub Totali">
    <p class="portao__nota">Entre com o seu e-mail da Totali.</p>

    <label class="pcampo">
      <span class="pcampo__rotulo">E-mail</span>
      <input class="pcampo__caixa" type="email" id="portao-email"
             autocomplete="username" required>
    </label>

    <label class="pcampo">
      <span class="pcampo__rotulo">Senha</span>
      <input class="pcampo__caixa" type="password" id="portao-senha"
             autocomplete="current-password" required>
    </label>

    <p class="portao__erro" id="portao-erro" hidden></p>

    <button class="portao__btn" type="submit" id="portao-btn">Entrar</button>

    <p class="portao__pe">Não tem acesso? Fale com a administração.</p>
  </form>
</main>

<div class="tela" id="tela" hidden>

  <nav class="nav" aria-label="Seções do Hub">
    <img class="nav__logo" src="assets/simbolo.png" alt="" width="32" height="32">
    <button class="nav__b on" type="button" id="nav-inicio" aria-label="Início" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button class="nav__b" type="button" id="nav-todos" aria-label="Todos os sistemas" title="Todos os sistemas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="nav__b" type="button" id="nav-pendencias" aria-label="Pendências" title="Pendências">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button class="nav__b" type="button" id="nav-agenda" aria-label="Agenda" title="Agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    </button>

    <a class="nav__b nav__b--fim" href="admin.html" id="nav-admin"
       aria-label="Administração" title="Administração">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>

    <!-- A marca da casa fecha o trilho. Aqui embaixo ela assina sem
         competir: quem abre o Hub veio trabalhar, não ver logo. -->
    <img class="nav__totali" src="assets/totali-branca.png" alt="Totali Soluções Contábeis">
  </nav>

  <header class="cab">
    <img class="cab__logo" src="assets/logo-hub.png" alt="Hub Totali">
    <span class="marca__nome" id="marca-nome" hidden>Hub Totali</span>
    <div class="rel">
      <div>
        <div class="rel__h" id="hora">--:--</div>
        <div class="rel__d" id="data"></div>
      </div>
      <span class="rel__risco"></span>
      <div>
        <button class="rel__ola" type="button" id="ola" title="Clique para trocar o nome"></button>
        <div class="rel__sub" id="resumo"></div>
      </div>
    </div>

    <!-- Com login obrigatório e sessão que se renova sozinha,
         sair precisa ser possível: computador de balcão, alguém
         que troca de turno, notebook emprestado. -->
    <button class="cab__sair" type="button" id="btn-sair"
            title="Sair desta conta neste navegador">Sair</button>
  </header>

  <main class="centro" id="centro"></main>

  <aside class="trilho" aria-label="Minhas pendências">
    <div class="trilho__t">Minhas pendências</div>
    <div id="pendencias"></div>
  </aside>

  <div class="avisos" id="avisos" aria-label="Avisos"></div>

</div>

<!-- Painel dos órgãos e consultas -->
<div class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="painel-t">
  <div class="painel__caixa">
    <div class="painel__cab">
      <span class="painel__t" id="painel-t">Órgãos, impostos e consultas</span>
      <button class="painel__x" type="button" id="painel-x" aria-label="Fechar">×</button>
    </div>
    <div id="painel-corpo"></div>
  </div>
</div>

<script src="js/config-hub.js"></script>
<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/agenda.js"></script>
<script src="js/dados.js"></script>
<script src="js/pendencias.js"></script>
<script src="js/pendencias-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
