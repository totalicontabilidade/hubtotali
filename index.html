<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Nenhum script externo, nenhuma CDN, nenhuma fonte remota. Fora
     da própria pasta o Hub só fala com dois endereços: o banco, de
     onde vem a lista, e o serviço de ícone — este último apenas
     para sistema recém-cadastrado, até alguém rodar
     ferramentas/baixar-logos.js e trazer o ícone para dentro. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self' file:;
  script-src 'self' file:;
  style-src 'self' file:;
  img-src 'self' file: data: https://icons.duckduckgo.com;
  font-src 'self' file:;
  connect-src https://firestore.googleapis.com https://identitytoolkit.googleapis.com;
  object-src 'none';
  base-uri 'none';
  form-action 'none'">
<meta name="referrer" content="no-referrer">

<title>Hub Totali</title>
<meta name="description" content="Todos os sistemas da Totali Soluções Contábeis em uma tela só.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1926">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="pular" href="#centro">Ir para os sistemas</a>

<div class="tela">

  <nav class="nav" aria-label="Seções do Hub">
    <img class="nav__logo" src="assets/simbolo.png" alt="" width="32" height="32">
    <button class="nav__b on" type="button" aria-label="Início" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button class="nav__b" type="button" id="nav-todos" aria-label="Todos os sistemas" title="Todos os sistemas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="nav__b" type="button" aria-label="Pendências" title="Pendências">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button class="nav__b" type="button" aria-label="Agenda" title="Agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    </button>

    <!-- A marca da casa fecha o trilho. Aqui embaixo ela assina sem
         competir: quem abre o Hub veio trabalhar, não ver logo. -->
    <img class="nav__totali" src="assets/totali-branca.png" alt="Totali Soluções Contábeis">
  </nav>

  <header class="cab">
    <img class="cab__logo" src="assets/logo-hub.png" alt="Hub Totali">
    <span class="marca__nome" id="marca-nome" hidden>Hub Totali</span>
    <div class="rel">
      <div>
        <div class="rel__h" id="hora">--:--</div>
        <div class="rel__d" id="data"></div>
      </div>
      <span class="rel__risco"></span>
      <div>
        <button class="rel__ola" type="button" id="ola" title="Clique para trocar o nome"></button>
        <div class="rel__sub" id="resumo"></div>
      </div>
    </div>
  </header>

  <main class="centro" id="centro"></main>

  <aside class="trilho" aria-label="Minhas pendências">
    <div class="trilho__t">Minhas pendências</div>
    <div id="pendencias"></div>
  </aside>

  <div class="avisos" id="avisos" aria-label="Avisos"></div>

</div>

<!-- Painel dos órgãos e consultas -->
<div class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="painel-t">
  <div class="painel__caixa">
    <div class="painel__cab">
      <span class="painel__t" id="painel-t">Órgãos, impostos e consultas</span>
      <button class="painel__x" type="button" id="painel-x" aria-label="Fechar">×</button>
    </div>
    <div id="painel-corpo"></div>
  </div>
</div>

<script src="js/config-hub.js"></script>
<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/agenda.js"></script>
<script src="js/dados.js"></script>
<script src="js/pendencias.js"></script>
<script src="js/pendencias-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
