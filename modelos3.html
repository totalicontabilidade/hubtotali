<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelos · rodada 3 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 3 — organização visual

   O erro das rodadas anteriores tem nome: caixa dentro de caixa.
   Cada bloco tinha moldura, e cada item dentro dele tinha outra.
   Duas bordas competindo pelo mesmo trabalho viram ruído, não
   organização.

   O que muda aqui, e vale para os três modelos:

   1. UM NÍVEL DE CONTENÇÃO, no máximo. Se a zona já tem fundo
      próprio, o item lá dentro não tem moldura nenhuma.

   2. QUEM SEPARA É O ESPAÇO. Grupo de coisas relacionadas fica
      junto; o espaço entre grupos é o dobro do espaço dentro do
      grupo. Isso é o princípio da proximidade, e ele funciona
      sozinho, sem desenhar nada.

   3. TRÊS ZONAS DECLARADAS: sistemas, pendências e recados
      ocupam regiões distintas da tela, e a distinção vem do
      fundo e da posição — não de uma borda em volta.

   4. UMA COR DE DESTAQUE SÓ. O dourado aparece no que é urgente
      e em nada mais. Dourado em tudo é o mesmo que dourado em
      nada.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#0a0e16;        /* o chão da página */
  --zona:#111925;        /* superfície de uma zona */
  --zona-2:#16202e;      /* passagem do mouse */
  --fio:rgba(255,255,255,.07);
  --txt:#e7edf6;
  --txt-2:#93a5bf;
  --txt-3:#6a7d99;
  --ouro:#e0b44c;
  --alerta:#e8776d;
  --calmo:#57a583;
  --r:16px;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:var(--base);color:var(--txt);min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid var(--fio);
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3)}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#0f1724;border:1px solid #1d2839;color:var(--txt-2);transition:all .16s}
.opcao:hover{background:#16202e;color:var(--txt)}
.opcao[aria-pressed="true"]{background:var(--ouro);border-color:var(--ouro);color:#191203}
.escolha__n{font-size:12px;color:var(--txt-3);margin-left:auto}

.modelo{display:none;min-height:100vh}
.modelo.ativo{display:block}

/* ---------- cabeçalho, igual nos três ---------- */
.cab{display:flex;align-items:center;gap:20px;padding:20px 40px}
.cab__logo{height:42px;width:auto}
.cab__ola{font-size:14.5px;color:var(--txt-2)}
.cab__ola b{color:var(--txt);font-weight:660}
.cab__rel{margin-left:auto;text-align:right}
.cab__hora{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:640}
.cab__data{font-size:12px;color:var(--txt-3)}

/* ---------- rótulo de grupo ---------- */
/* Sem linha, sem fundo, sem caixa: só tamanho, peso e cor. É o
   suficiente para o olho entender que começou outro assunto. */
.grupo__rot{font-size:10.5px;font-weight:730;letter-spacing:.14em;text-transform:uppercase;
            color:var(--txt-3);margin-bottom:14px}

/* ---------- sistema, sem cartão ---------- */
/* O ícone é o cartão. Não precisa de retângulo em volta de um
   retângulo. */
.sis{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
     padding:6px 4px;border-radius:14px;transition:background .15s}
.sis:hover{background:rgba(255,255,255,.045)}
.sis__ico{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;
          overflow:hidden;flex:none;transition:transform .2s cubic-bezier(.16,1,.3,1)}
.sis:hover .sis__ico{transform:translateY(-3px)}
.sis__ico img{width:30px;height:30px;object-fit:contain}
.sis__ico--sigla{background:linear-gradient(150deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780;font-size:15px}
.sis__nome{font-size:11.5px;font-weight:600;color:var(--txt-2);line-height:1.3}
.sis:hover .sis__nome{color:var(--txt)}
.sistemas{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px 6px}

/* O espaço entre grupos é o dobro do espaço dentro do grupo.
   Essa é a regra inteira da separação por proximidade. */
.grupo + .grupo{margin-top:34px}

/* ---------- órgãos: pastilha miúda ----------
   Vinte e cinco endereços que ninguém abre de manhã. Com o mesmo
   ícone dos principais, eles empurravam o que importa para baixo
   da dobra. Aqui ficam pequenos, numa tira só, e continuam a um
   clique de distância. */
.tira{display:flex;flex-wrap:wrap;gap:6px}
.past{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:99px;
      background:rgba(255,255,255,.045);transition:background .15s}
.past:hover{background:rgba(255,255,255,.11)}
.past__ico{width:19px;height:19px;border-radius:6px;background:#fff;display:grid;place-items:center;
           overflow:hidden;flex:none}
.past__ico img{width:13px;height:13px;object-fit:contain}
.past__ico--sigla{background:var(--ouro);color:#191203;font-weight:780;font-size:7.5px}
.past__nome{font-size:12px;font-weight:580;color:var(--txt-2);white-space:nowrap}
.past:hover .past__nome{color:var(--txt)}

/* ---------- pendência, sem cartão ---------- */
/* Linhas separadas por fio finíssimo, como extrato bancário.
   Extrato é um dos formatos mais legíveis que existem, e nunca
   teve uma caixa por linha. */
.pen{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--fio);align-items:flex-start}
.pen:last-child{border-bottom:0}
.pen__prazo{flex:none;width:38px;text-align:center;padding-top:1px}
.pen__dia{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__mes{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:3px}
.pen__oque{font-size:13.5px;font-weight:620;line-height:1.35}
.pen__quem{font-size:11.5px;color:var(--txt-3);margin-top:3px}
.pen--atrasada .pen__dia{color:var(--alerta)}
.pen--hoje .pen__dia{color:var(--ouro)}

/* ---------- recado ---------- */
.rec{display:flex;gap:10px;align-items:baseline}
.rec__p{width:6px;height:6px;border-radius:50%;background:var(--ouro);flex:none;position:relative;top:-1px}
.rec__t{font-size:13px;font-weight:620}
.rec__x{font-size:12.5px;color:var(--txt-3)}

/* ============================================================
   R1 · TRILHO
   Sistemas ocupam a área principal, direto sobre o chão da
   página, sem nenhuma superfície embaixo. As pendências ficam
   num trilho à direita, e o trilho TEM fundo próprio — é essa
   diferença de fundo, e só ela, que diz "aqui é outro assunto".
   Recados vão para uma faixa embaixo, separados por um fio.
   ============================================================ */
#R1 .corpo{display:grid;grid-template-columns:1fr 320px;gap:0;align-items:start}
#R1 .area{padding:8px 40px 40px}
#R1 .trilho{background:var(--zona);border-radius:var(--r) 0 0 var(--r);padding:24px;
            min-height:calc(100vh - 82px);margin-right:0}
#R1 .trilho__t{font-size:13px;font-weight:700;margin-bottom:4px}
#R1 .trilho__n{font-size:12px;color:var(--txt-3);margin-bottom:14px}
#R1 .rodape{border-top:1px solid var(--fio);padding:18px 40px;display:flex;gap:38px;flex-wrap:wrap}

/* ============================================================
   R2 · FAIXAS
   A tela é uma pilha de faixas de largura inteira, e cada faixa
   tem um tom de fundo próprio. Nenhuma caixa em lugar nenhum: a
   mudança de tom, sozinha, já diz que mudou de assunto.
   ============================================================ */
#R2 .faixa{padding:30px 40px}
#R2 .faixa--sis{background:var(--base)}
#R2 .faixa--pen{background:var(--zona)}
#R2 .faixa--rec{background:#0d141e;padding:20px 40px}
#R2 .faixa__t{font-size:13px;font-weight:700;margin-bottom:3px}
#R2 .faixa__n{font-size:12px;color:var(--txt-3);margin-bottom:16px}
#R2 .pendencias{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 40px}
#R2 .recados{display:flex;gap:40px;flex-wrap:wrap}

/* ============================================================
   R3 · DUAS TELAS
   Separação total: ou você está vendo sistemas, ou está vendo
   pendências. Nunca os dois brigando pelo mesmo olhar. É o
   caminho mais limpo possível — e o preço é um clique para
   trocar.
   ============================================================ */
#R3 .abas{display:flex;gap:4px;padding:0 40px 18px}
#R3 .aba{padding:9px 18px;border-radius:11px;font-size:13.5px;font-weight:640;color:var(--txt-3);
         transition:all .16s;display:flex;align-items:center;gap:9px}
#R3 .aba:hover{background:rgba(255,255,255,.05);color:var(--txt-2)}
#R3 .aba.on{background:var(--zona);color:var(--txt)}
#R3 .aba__n{font-size:11px;font-weight:730;background:var(--ouro);color:#191203;
            padding:1px 7px;border-radius:99px}
#R3 .tela{display:none;padding:0 40px 44px}
#R3 .tela.on{display:block}
#R3 .faixa-rec{display:flex;gap:36px;flex-wrap:wrap;padding:14px 40px;margin:0 0 20px;
               background:var(--zona);border-top:1px solid var(--fio);border-bottom:1px solid var(--fio)}
#R3 .pendencias{max-width:760px}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 3</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Três zonas separadas · sem cartão por item</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos3.js"></script>
</body>
</html>
