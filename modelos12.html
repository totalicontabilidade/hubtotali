<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refinamentos · rodada 12 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 12 — refinar o vencedor

   O Trilho voltou em todas as comparações. Então paro de propor
   conceitos e passo a lapidar este. As cinco ideias abaixo não
   mudam a planta da casa: cada uma acrescenta UMA coisa que eu
   acho que vale, e some com o resto para dar para julgar
   isolado.

   R1  pendências agrupadas por urgência, não em lista corrida
   R2  atalhos que cada pessoa monta
   R3  o quanto do dia já foi resolvido
   R4  a agenda em faixa, com hoje ancorado
   R5  barra de comando pelo teclado

   Todas mantêm a paleta Marca e o relógio pequeno.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#f3f5f9; --papel:#fff; --realce:#f3f5f9; --fio:#e4e9f1; --fio-2:#cfd8e4;
  --txt:#0d1926; --txt-2:#4c5f78; --txt-3:#7f92aa;
  --nav:#0d1926; --nav-txt:#93a8c4;
  --acento:#c2a250; --acento-esc:#87681c; --acento-txt:#1a1204;
  --alerta:#c0453a; --alerta-luz:#fdeceb;
  --ok:#2f7d55;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e;color:var(--txt)}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#5c7093;margin-left:auto}

.modelo{display:none}
.modelo.ativo{display:block}

/* ---------- o Trilho, igual nas cinco ---------- */
.tela{height:calc(100vh - 47px);display:grid;grid-template-columns:64px 1fr 400px;
      grid-template-rows:auto 1fr;background:var(--base);overflow:hidden}
.nav{grid-row:1/-1;grid-column:1;background:var(--nav);display:flex;flex-direction:column;
     align-items:center;gap:5px;padding:14px 0}
.nav__logo{width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s,color .14s}
.nav__b:hover{background:rgba(255,255,255,.10);color:#fff}
.nav__b.on{background:var(--acento);color:var(--acento-txt)}
.nav__b svg{width:19px;height:19px}

.cab{grid-column:2/-1;grid-row:1;display:flex;align-items:center;gap:18px;
     padding:12px 24px;border-bottom:1px solid var(--fio);background:var(--papel)}
.marca{height:38px;width:auto}
.rel{margin-left:auto;display:flex;align-items:center;gap:13px}
.rel__h{font-family:var(--mono);font-size:17px;font-weight:680}
.rel__d{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.rel__risco{width:1px;height:28px;background:var(--fio)}
.rel__ola{font-size:14px;font-weight:640}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta)}

.centro{grid-column:2;grid-row:2;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.lado{grid-column:3;grid-row:2;overflow:auto;padding:18px 20px;background:var(--papel);
      border-left:1px solid var(--fio)}

.rot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.17em;
     text-transform:uppercase;color:var(--txt-3)}
.bloco{background:var(--papel);border:1px solid var(--fio);border-radius:14px;padding:15px 17px;
       display:flex;flex-direction:column;min-height:0}
.bloco__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bloco__t{font-size:14px;font-weight:730}
.bloco__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:13px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
     padding:7px 3px;border-radius:11px;transition:background .14s;position:relative}
.app:hover{background:var(--realce)}
.ico{border-radius:12px;background:#fff;border:1px solid var(--fio);display:grid;place-items:center;
     overflow:hidden;flex:none;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.app:hover .ico{transform:translateY(-3px)}
.app .ico{width:42px;height:42px}
.app .ico img{width:28px;height:28px;object-fit:contain}
.ico--sigla{background:var(--acento);color:var(--acento-txt);font-weight:780;border:0}
.app .ico--sigla{font-size:13px}
.app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}

.gaveta{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:14px;
        background:var(--papel);border:1px solid var(--fio);width:100%;text-align:left;
        transition:border-color .15s}
.gaveta:hover{border-color:var(--acento)}
.gaveta__c{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
           background:var(--acento);color:var(--acento-txt);font-family:var(--mono);font-size:14px;font-weight:700}
.gaveta__t{font-size:13.5px;font-weight:660}
.gaveta__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.gaveta__seta{margin-left:auto;color:var(--txt-3);font-size:20px}

.pen{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--base);
     align-items:flex-start;margin-bottom:7px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--acento)}
.pen__p{flex:none;width:38px;text-align:center}
.pen__d{font-family:var(--mono);font-size:17px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--acento-esc)}
.pen__o{font-size:13px;font-weight:640;line-height:1.35}
.pen__q{font-size:11px;color:var(--txt-3);margin-top:3px}

.aviso{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:var(--base);
       margin-bottom:6px;align-items:flex-start}
.aviso__p{width:6px;height:6px;border-radius:50%;background:var(--acento);flex:none;margin-top:5px}
.aviso__t{font-size:12.5px;font-weight:660}
.aviso__x{font-size:11.5px;color:var(--txt-2);margin-top:2px}

.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.prazo{background:var(--realce);border-radius:10px;padding:10px 11px;border-left:3px solid var(--fio-2)}
.prazo--perto{border-left-color:var(--acento)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:19px;font-weight:730;line-height:1}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--acento-esc)}
.prazo__n{font-size:10.5px;font-weight:620;color:var(--txt-2);margin-top:5px;line-height:1.3}
.prazo__q{font-size:9.5px;color:var(--txt-3);margin-top:2px}

/* ============================================================
   R1 · pendências por urgência
   Lista corrida obriga a ler as cinco para saber quais são de
   hoje. Agrupada, a resposta vem antes da leitura: o título já
   diz, e a contagem confirma.
   ============================================================ */
.faixa-pen{display:flex;align-items:center;gap:8px;margin:16px 0 9px}
.faixa-pen:first-child{margin-top:0}
.faixa-pen__t{font-size:11.5px;font-weight:730;letter-spacing:.04em;text-transform:uppercase}
.faixa-pen__n{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px}
.faixa-pen--atraso .faixa-pen__t{color:var(--alerta)}
.faixa-pen--atraso .faixa-pen__n{background:var(--alerta-luz);color:var(--alerta)}
.faixa-pen--hoje .faixa-pen__t{color:var(--acento-esc)}
.faixa-pen--hoje .faixa-pen__n{background:#f7f1e2;color:var(--acento-esc)}
.faixa-pen--depois .faixa-pen__t{color:var(--txt-3)}
.faixa-pen--depois .faixa-pen__n{background:var(--base);color:var(--txt-3)}

/* ============================================================
   R2 · atalhos que cada um monta
   ============================================================ */
.pino{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
      display:grid;place-items:center;color:#c3cedb;opacity:0;transition:opacity .14s,color .14s}
.app:hover .pino{opacity:1}
.pino:hover{color:var(--acento-esc)}
.pino.on{opacity:1;color:var(--acento-esc)}
.pino svg{width:12px;height:12px;fill:currentColor}
.vazio-atalhos{font-size:12px;color:var(--txt-3);padding:14px 4px;text-align:center;
               border:1px dashed var(--fio-2);border-radius:11px}

/* ============================================================
   R3 · o quanto do dia já foi
   ============================================================ */
.progresso{display:flex;align-items:center;gap:14px;padding:14px 17px;border-radius:14px;
           background:var(--nav);color:#e9eef7}
.progresso__n{font-family:var(--mono);font-size:26px;font-weight:730;line-height:1;color:var(--acento)}
.progresso__t{font-size:13px;font-weight:640}
.progresso__s{font-size:11.5px;color:#9db0cb;margin-top:2px}
.barra{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;min-width:80px}
.barra__i{height:100%;background:var(--acento);border-radius:99px}
.progresso__p{font-family:var(--mono);font-size:12px;color:#9db0cb;flex:none}

/* ============================================================
   R4 · agenda em faixa, hoje ancorado
   ============================================================ */
.tira-agenda{display:flex;gap:0;overflow:auto;padding-bottom:2px}
.dia{flex:none;width:74px;text-align:center;padding:10px 4px;border-right:1px solid var(--fio)}
.dia:last-child{border-right:0}
.dia__s{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt-3)}
.dia__d{font-family:var(--mono);font-size:20px;font-weight:730;line-height:1;margin-top:5px}
.dia__m{font-size:9.5px;color:var(--txt-3);margin-top:4px;line-height:1.25;min-height:24px}
.dia--hoje{background:var(--nav);border-radius:11px;border-right-color:transparent}
.dia--hoje .dia__s,.dia--hoje .dia__m{color:#9db0cb}
.dia--hoje .dia__d{color:var(--acento)}
.dia--marcado .dia__d{color:var(--acento-esc)}
.dia__ponto{width:5px;height:5px;border-radius:50%;background:var(--acento);margin:5px auto 0}

/* ============================================================
   R5 · barra de comando
   ============================================================ */
.dica-teclado{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;
              background:var(--papel);border:1px solid var(--fio);font-size:12.5px;color:var(--txt-3);
              cursor:pointer;transition:border-color .15s}
.dica-teclado:hover{border-color:var(--acento)}
.tecla{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--base);
       border:1px solid var(--fio-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--txt-2)}
.comando{position:fixed;inset:0;z-index:90;display:none;justify-content:center;align-items:flex-start;
         background:rgba(13,25,38,.45);padding:14vh 20px}
.comando.on{display:flex}
.comando__caixa{background:var(--papel);border-radius:16px;width:100%;max-width:560px;overflow:hidden;
                box-shadow:0 24px 60px rgba(13,25,38,.3)}
.comando__campo{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--fio)}
.comando__campo input{border:0;outline:0;background:none;flex:1;font-size:16px;color:var(--txt)}
.comando__campo svg{width:18px;height:18px;color:var(--txt-3);flex:none}
.comando__lista{max-height:44vh;overflow:auto;padding:8px}
.comando__i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px}
.comando__i:hover,.comando__i.sel{background:var(--realce)}
.comando__i .ico{width:26px;height:26px;border-radius:8px}
.comando__i .ico img{width:17px;height:17px;object-fit:contain}
.comando__i .ico--sigla{font-size:9.5px}
.comando__n{font-size:13.5px;font-weight:620}
.comando__g{font-size:11px;color:var(--txt-3);margin-left:auto}
.comando__pe{padding:10px 18px;border-top:1px solid var(--fio);font-size:11.5px;color:var(--txt-3);
             display:flex;gap:16px}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Refinamentos</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Trilho + paleta Marca · uma ideia nova em cada</span>
</div>

<div id="palco"></div>

<div class="comando" id="comando">
  <div class="comando__caixa">
    <div class="comando__campo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="comando-campo" placeholder="Abrir sistema, buscar pendência…">
    </div>
    <div class="comando__lista" id="comando-lista"></div>
    <div class="comando__pe">
      <span><span class="tecla">↑↓</span> navegar</span>
      <span><span class="tecla">Enter</span> abrir</span>
      <span><span class="tecla">Esc</span> fechar</span>
    </div>
  </div>
</div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos12.js"></script>
</body>
</html>
