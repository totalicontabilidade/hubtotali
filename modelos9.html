<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodada 9 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 9 — ocupar a tela, e parecer tecnologia

   DOIS PROBLEMAS SEPARADOS, E O PRIMEIRO TEM CAUSA CONHECIDA:

   Sobrava espaço porque não havia conteúdo para preencher. Doze
   ícones e cinco pendências não ocupam 1080 pixels por mais que
   eu estique a margem. Esticar sem ter o que pôr dentro só
   produz um vazio maior e mais bem distribuído.

   Então aqui a tela passa a ocupar 100% da altura POR
   CONSTRUÇÃO — as zonas crescem para caber — e entra uma
   terceira zona que ganha o espaço merecendo: a agenda do mês,
   com os vencimentos. É informação que a equipe procura em
   algum lugar todo dia; melhor que procure aqui.

   SOBRE "PARECER TECNOLOGIA":

   Não é escurecer a tela. O que faz uma interface ler como
   ferramenta técnica é um conjunto de sinais concretos —
   número em fonte monoespaçada, linha de grade visível,
   rótulo em caixa alta miúda, medida exposta em vez de
   escondida, uma cor de acento fria e saturada. Cada modelo
   abaixo puxa esses sinais numa direção diferente.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#5c7093;margin-left:auto}

.modelo{display:none}
.modelo.ativo{display:block}

/* ============================================================
   ESQUELETO QUE PREENCHE
   Altura da janela menos a barra de escolha. As linhas do grid
   crescem: nada fica boiando no alto com vazio embaixo.
   ============================================================ */
.tela{
  height:calc(100vh - 47px);
  display:grid;
  grid-template-columns:var(--col-nav,0) 1fr var(--col-trilho,400px);
  grid-template-rows:auto 1fr;
  background:var(--base);color:var(--txt);
  overflow:hidden;
}
.cab{grid-column:1/-1;display:flex;align-items:center;gap:22px;
     padding:14px 28px;border-bottom:1px solid var(--fio);background:var(--cab-bg,transparent)}
.marca{height:44px;width:auto}
.rel{margin-left:auto;display:flex;align-items:center;gap:16px}
.rel__h{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--txt)}
.rel__d{font-size:11px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.rel__risco{width:1px;height:34px;background:var(--fio)}
.rel__ola{font-size:14.5px;font-weight:640;color:var(--txt)}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta)}

/* Coluna explícita, não automática. Com --col-nav em zero, o
   auto-posicionamento do grid enfiava o centro na coluna de
   largura nenhuma e empurrava o trilho para o lugar dele. */
.centro{grid-row:2;grid-column:2;overflow:auto;padding:20px 28px;display:flex;flex-direction:column;gap:14px}
.trilho{grid-row:2;grid-column:3;overflow:auto;padding:20px 24px;background:var(--trilho-bg);
        border-left:1px solid var(--fio)}

/* rótulo técnico: caixa alta miúda, muito espaçada */
.rot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;
     text-transform:uppercase;color:var(--txt-3)}

/* ---------- zona de aplicativos ---------- */
.zona{background:var(--zona);border:1px solid var(--zona-fio);border-radius:var(--r);
      padding:16px 18px;display:flex;flex-direction:column}
.zona--cresce{flex:1;min-height:0}
.zona__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.zona__n{font-family:var(--mono);font-size:11px;color:var(--txt-3);margin-left:auto}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
      gap:14px 6px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
     padding:8px 3px;border-radius:12px;transition:background .14s}
.app:hover{background:var(--realce)}
.ico{width:44px;height:44px;border-radius:13px;background:#fff;display:grid;place-items:center;
     overflow:hidden;flex:none;border:1px solid var(--ico-fio);
     transition:transform .18s cubic-bezier(.16,1,.3,1)}
.app:hover .ico{transform:translateY(-3px)}
.ico img{width:29px;height:29px;object-fit:contain}
.ico--sigla{background:linear-gradient(150deg,var(--acento),var(--acento-2));color:var(--acento-txt);
            font-weight:780;font-size:14px;border:0}
.app__n{font-size:11px;font-weight:600;color:var(--txt-2);line-height:1.25}
.app:hover .app__n{color:var(--txt)}

.gaveta{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:var(--r);
        background:var(--zona);border:1px solid var(--zona-fio);width:100%;text-align:left;
        transition:border-color .15s}
.gaveta:hover{border-color:var(--acento)}
.gaveta__c{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;
           background:var(--acento);color:var(--acento-txt);font-family:var(--mono);
           font-size:15px;font-weight:700}
.gaveta__t{font-size:14px;font-weight:660;color:var(--txt)}
.gaveta__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.gaveta__seta{margin-left:auto;color:var(--txt-3);font-size:20px}

/* ---------- agenda do mês: a zona que ganha o espaço ---------- */
.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.prazo{background:var(--realce);border-radius:11px;padding:11px 12px;
       border-left:3px solid var(--fio-2);position:relative}
.prazo--perto{border-left-color:var(--acento)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:20px;font-weight:730;line-height:1;color:var(--txt)}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--acento)}
.prazo__n{font-size:11px;font-weight:620;color:var(--txt-2);margin-top:6px;line-height:1.3}
.prazo__q{font-size:10px;color:var(--txt-3);margin-top:2px}

/* ---------- trilho ---------- */
.trilho__t{font-size:15px;font-weight:730;color:var(--txt)}
.trilho__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.trilho__n{font-family:var(--mono);font-size:11px;color:var(--txt-3);margin-left:auto}
.pen{display:flex;gap:12px;padding:13px;border-radius:12px;background:var(--zona);
     border:1px solid var(--zona-fio);align-items:flex-start;margin-bottom:8px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--acento)}
.pen__p{flex:none;width:40px;text-align:center}
.pen__d{font-family:var(--mono);font-size:18px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--acento)}
.pen__o{font-size:13.5px;font-weight:640;line-height:1.35;color:var(--txt)}
.pen__q{font-size:11.5px;color:var(--txt-3);margin-top:3px}
.aviso{display:flex;gap:10px;padding:11px 13px;border-radius:11px;background:var(--realce);
       margin-bottom:7px;align-items:flex-start}
.aviso__p{width:6px;height:6px;border-radius:50%;background:var(--acento);flex:none;margin-top:5px}
.aviso__t{font-size:12.5px;font-weight:660;color:var(--txt)}
.aviso__x{font-size:11.5px;color:var(--txt-2);margin-top:2px}

/* ---------- trilho de navegação (só em alguns modelos) ---------- */
.nav{grid-row:1/-1;grid-column:1;background:var(--nav-bg);display:flex;flex-direction:column;
     align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--fio)}
.nav__logo{width:34px;height:34px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s}
.nav__b:hover{background:rgba(255,255,255,.09)}
.nav__b.on{background:var(--acento);color:var(--acento-txt)}
.nav__b svg{width:19px;height:19px}

/* ============================================================
   T1 · PROJETO — claro, com grade de desenho técnico
   Fundo branco com linhas de grade finíssimas, como papel
   milimetrado. Rótulo e número em monoespaçada. Acento em azul
   de blueprint. Lê como ferramenta de engenharia, não como
   site.
   ============================================================ */
#T1 .tela{
  --base:#f7f9fc; --zona:#ffffff; --zona-fio:#e3e9f2; --realce:#f2f6fb;
  --fio:#e3e9f2; --fio-2:#cfd9e6; --ico-fio:#e3e9f2;
  --txt:#0f1b2d; --txt-2:#4a5f7a; --txt-3:#8194ad;
  --acento:#1e6fd9; --acento-2:#144a94; --acento-txt:#fff;
  --alerta:#c0453a; --r:12px;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  background-image:linear-gradient(#e9eef6 1px,transparent 1px),
                   linear-gradient(90deg,#e9eef6 1px,transparent 1px);
  background-size:26px 26px;
}
#T1 .cab{background:#fff}

/* ============================================================
   T2 · CONSOLE — escuro, acento ciano, tudo monoespaçado
   O extremo técnico. Quase preto, verde-ciano de terminal,
   fios de grade sutis. Para quem quer que pareça sala de
   servidores.
   ============================================================ */
#T2 .tela{
  --base:#080b10; --zona:#0e131b; --zona-fio:#1b2430; --realce:#131a24;
  --fio:#1b2430; --fio-2:#2a3644; --ico-fio:transparent;
  --txt:#dce6f0; --txt-2:#8fa3b8; --txt-3:#61748a;
  --acento:#2fd6b0; --acento-2:#149a7c; --acento-txt:#06231c;
  --alerta:#ff6b5e; --r:10px;
  --trilho-bg:#0b1018;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
#T2 .rot,#T2 .app__n,#T2 .gaveta__s,#T2 .prazo__q{font-family:var(--mono)}
#T2 .ico{background:#fff}

/* ============================================================
   T3 · ÍNDIGO — escuro em azul-violeta com brilho no acento
   Meio-termo: escuro sem ser preto, acento em índigo elétrico
   com um halo suave. É a linguagem de produto de software
   moderno — a que mais "vende" numa demonstração.
   ============================================================ */
#T3 .tela{
  --base:#0d1020; --zona:#151a2e; --zona-fio:#232a45; --realce:#1b2138;
  --fio:#232a45; --fio-2:#333c5c; --ico-fio:transparent;
  --txt:#e6e9f7; --txt-2:#9aa3c4; --txt-3:#6d769b;
  --acento:#7c6cff; --acento-2:#4f3fd6; --acento-txt:#fff;
  --alerta:#ff7a8a; --r:15px;
  --trilho-bg:#111528;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
#T3 .ico{background:#fff}
#T3 .zona{box-shadow:0 0 0 1px rgba(124,108,255,.06)}
#T3 .gaveta__c{box-shadow:0 6px 20px rgba(124,108,255,.4)}

/* ============================================================
   T4 · TRILHO ESCURO — claro, com barra lateral escura
   O padrão de painel de SaaS: coluna estreita e escura à
   esquerda com ícones, conteúdo claro no meio. Ocupa a altura
   inteira por construção e é o mais familiar de todos — quem
   usa qualquer sistema moderno já sabe onde clicar.
   ============================================================ */
#T4 .tela{
  --col-nav:64px;
  --base:#f4f6fa; --zona:#ffffff; --zona-fio:#e4e9f1; --realce:#f4f6fa;
  --fio:#e4e9f1; --fio-2:#cfd8e4; --ico-fio:#e4e9f1;
  --txt:#0f1a2b; --txt-2:#4b5f79; --txt-3:#7f92aa;
  --acento:#c99a2e; --acento-2:#96762b; --acento-txt:#1b1305;
  --alerta:#c0453a; --r:14px;
  --nav-bg:#0f1a2b; --nav-txt:#94a7c0; --cab-bg:#fff;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
#T4 .cab{grid-column:2/-1}

/* ============================================================
   T5 · ALTO CONTRASTE — claro no meio, trilho preto
   O conteúdo é branco e limpo; o trilho das pendências é
   quase preto com acento âmbar. O corte entre "o que abrir" e
   "o que fazer" fica impossível de confundir.
   ============================================================ */
#T5 .tela{
  --base:#ffffff; --zona:#f6f8fc; --zona-fio:#eaeff6; --realce:#eef2f8;
  --fio:#e8edf4; --fio-2:#d3dbe6; --ico-fio:#e8edf4;
  --txt:#0d1524; --txt-2:#485971; --txt-3:#7b8ca4;
  --acento:#0d1524; --acento-2:#0d1524; --acento-txt:#e0b44c;
  --alerta:#c0453a; --r:14px;
  --trilho-bg:#0d1524;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
#T5 .trilho{--zona:#161f31;--zona-fio:#232e44;--realce:#1a2438;
            --txt:#e9eef7;--txt-2:#9fb0c8;--txt-3:#7387a1;--acento:#e0b44c;--fio-2:#2b3752}
#T5 .trilho .aviso__p{background:#e0b44c}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 9</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Ocupa a altura toda · cinco linguagens</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos9.js"></script>
</body>
</html>
