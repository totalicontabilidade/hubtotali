# ============================================================
# Hub Totali · notícias e agenda oficial, de meia em meia hora
# ------------------------------------------------------------
# O Hub é um site estático: não tem servidor para buscar nada.
# Quem busca é este robô do GitHub, que roda os dois programas da
# pasta ferramentas/ e, se algo mudou, grava o resultado em
# dados/*.json e faz um commit. O GitHub Pages republica sozinho.
#
# Quem dispara: a função "relogio" no Google Cloud (funcoes/
# index.js), pontual, de meia em meia hora em dia útil, das 7h05 às
# 19h35 de Brasília. O schedule abaixo é só reserva, porque o
# GitHub atrasa e pula rodadas agendadas. Também pode ser disparado
# à mão em Actions → "Atualizar notícias e agenda".
# ============================================================
name: Atualizar notícias e agenda

on:
  schedule:
    # De meia em meia hora em dia útil (07:05 às 19:35 em Brasília) e uma vez
    # no sábado. O GitHub não garante a hora: em dia cheio atrasa ou pula
    # rodadas, por isso duas chances por hora — só grava quando algo mudou.
    - cron: "5,35 10-22 * * 1-5"
    - cron: "15 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar notícias oficiais
        # A SEFAZ/SE não responde a quem está fora do Brasil; vai pela
        # ponte, uma função no Google Cloud em São Paulo (funcoes/).
        env:
          PONTE_URL: https://southamerica-east1-hubtotali.cloudfunctions.net/ponte
        run: node ferramentas/buscar-noticias.js

      - name: Buscar agenda oficial da Receita
        run: node ferramentas/buscar-agenda.js

      - name: Gravar o que mudou
        run: |
          git add dados/noticias.json dados/agenda-oficial.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git -c user.name="Robô do Hub" -c user.email="hub-robo@users.noreply.github.com" \
            commit -m "Notícias e agenda: atualização automática"
          git push
