<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodada 6 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 6 — três correções pedidas, quatro caminhos

   Vindo do 1 (Colunas) e do 3 (Primeira fila), com:

   1. PENDÊNCIAS E AVISOS COM PESO. Antes o trilho era estreito e
      os recados iam para um rodapé miúdo. Agora os dois moram na
      mesma zona, larga, e essa zona tem tanto direito à tela
      quanto os aplicativos.

   2. SAUDAÇÃO JUNTO DO RELÓGIO. "Boa tarde, Hesley" e a hora são
      a mesma informação — onde você está no dia. Estavam em
      pontas opostas do cabeçalho, o que obrigava o olho a
      atravessar a tela para juntar duas metades de uma frase.

   3. A MARCA À MOSTRA. Ela estava do tamanho de um ícone de
      barra de tarefas. Passa a ter altura de verdade, e o nome
      "Hub Totali" volta escrito ao lado dela em alguns modelos —
      um Hub que a equipe abre trinta vezes por dia deveria dizer
      o nome dele.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#eef1f6; --zona:#ffffff; --realce:#ffffff;
  --fio:#dfe5ee; --fio-2:#cdd6e3;
  --navy:#101a2b;
  --txt:#101a2b; --txt-2:#4a5d78; --txt-3:#78899f;
  --ouro:#96762b; --ouro-luz:#f6efdd; --ouro-vivo:#c99a2e;
  --alerta:#c0453a; --alerta-luz:#fdeceb;
  --calmo:#2f7d55;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:var(--base);color:var(--txt);min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#0c1420;border-bottom:1px solid #1d2839;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#132033;border:1px solid #22304a;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#1a2b42;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#657ba0;margin-left:auto}

.modelo{display:none;min-height:100vh}
.modelo.ativo{display:block}

/* ---------- 3 · a marca, à mostra ---------- */
.marca{display:flex;align-items:center;gap:13px;flex:none}
.marca__img{height:52px;width:auto}
.marca__nome{font-size:19px;font-weight:730;letter-spacing:-.025em;color:var(--navy);line-height:1.1}
.marca__sub{font-size:11.5px;color:var(--txt-3);letter-spacing:.02em}

/* ---------- 2 · saudação colada no relógio ---------- */
.agora{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none;
       background:var(--zona);border-radius:14px;padding:10px 18px}
.agora__hora{font-family:ui-monospace,Consolas,monospace;font-size:23px;font-weight:700;
             line-height:1;color:var(--navy);letter-spacing:-.02em}
.agora__data{font-size:11.5px;color:var(--txt-3);margin-top:4px}
.agora__risco{width:1px;align-self:stretch;background:var(--fio)}
.agora__ola{font-size:15px;font-weight:640;color:var(--navy);line-height:1.2}
.agora__nota{font-size:11.5px;color:var(--txt-2);margin-top:3px}
.agora__nota b{color:var(--alerta);font-weight:700}

.cab{display:flex;align-items:center;gap:20px;padding:18px 34px}

/* ---------- peças ---------- */
.rot{font-size:10.5px;font-weight:730;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.ico{border-radius:11px;background:#fff;border:1px solid var(--fio);display:grid;place-items:center;
     overflow:hidden;flex:none}
.ico img{object-fit:contain}
.ico--sigla{background:linear-gradient(150deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780;border:0}

.item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;transition:background .14s}
.item:hover{background:var(--realce)}
.item .ico{width:28px;height:28px;border-radius:8px}
.item .ico img{width:19px;height:19px}
.item .ico--sigla{font-size:10px}
.item__n{font-size:13px;font-weight:600;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover .item__n{color:var(--txt)}

.colunas-apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px}
.col__rot{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--fio)}

/* ---------- 1 · pendência com peso ---------- */
.pen{display:flex;gap:14px;padding:14px;border-radius:13px;background:var(--zona);
     align-items:flex-start;margin-bottom:8px;transition:box-shadow .15s,transform .15s}
.pen:hover{box-shadow:0 8px 22px rgba(16,26,43,.10);transform:translateY(-2px)}
.pen__faixa{width:4px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__faixa{background:var(--alerta)}
.pen--hoje .pen__faixa{background:var(--ouro-vivo)}
.pen__prazo{flex:none;width:44px;text-align:center}
.pen__dia{font-family:ui-monospace,Consolas,monospace;font-size:19px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__mes{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__dia{color:var(--alerta)}
.pen--hoje .pen__dia{color:var(--ouro)}
.pen__oque{font-size:14px;font-weight:640;line-height:1.35}
.pen__quem{font-size:12px;color:var(--txt-3);margin-top:4px}
.pen__sel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          padding:3px 9px;border-radius:99px;margin-left:auto;flex:none;white-space:nowrap}
.pen--atrasada .pen__sel{background:var(--alerta-luz);color:var(--alerta)}
.pen--hoje .pen__sel{background:var(--ouro-luz);color:var(--ouro)}

.zona__cab{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.zona__t{font-size:16px;font-weight:730;color:var(--navy)}
.zona__n{font-size:12.5px;color:var(--txt-3)}
.zona__n b{color:var(--alerta)}

.aviso{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:var(--ouro-luz);
       margin-bottom:7px;align-items:flex-start}
.aviso__p{width:7px;height:7px;border-radius:50%;background:var(--ouro-vivo);flex:none;margin-top:5px}
.aviso__t{font-size:13px;font-weight:660;color:var(--navy)}
.aviso__x{font-size:12px;color:var(--txt-2);margin-top:2px}

/* ============================================================
   M1 · TRILHO LARGO
   O trilho engorda de 330 para 420 e engole os avisos, que
   deixam de morar no rodapé. Sistemas em colunas à esquerda.
   ============================================================ */
#M1 .corpo{display:grid;grid-template-columns:1fr 420px;gap:0;align-items:start}
#M1 .area{padding:6px 30px 36px}
#M1 .trilho{background:var(--base);border-left:1px solid var(--fio);padding:22px 26px;
            min-height:calc(100vh - 96px)}
#M1 .aviso{background:var(--zona)}

/* ============================================================
   M2 · FAIXA DE COMANDO
   Pendências e avisos sobem para uma faixa larga logo abaixo do
   cabeçalho — a primeira coisa depois do "bom dia". Os
   aplicativos ficam embaixo, em colunas.
   ============================================================ */
#M2 .faixa{background:var(--zona);border-radius:18px;margin:0 34px 22px;padding:22px 24px}
#M2 .duas{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
#M2 .pen{background:var(--base)}
#M2 .area{padding:0 34px 36px}

/* ============================================================
   M3 · DOIS TERÇOS
   A tela se divide ao meio no eixo vertical: pendências e avisos
   ocupam a coluna da direita inteira, do topo ao rodapé, com a
   mesma largura que os aplicativos. Peso igual, lado a lado.
   ============================================================ */
#M3 .corpo{display:grid;grid-template-columns:1.35fr 1fr;gap:0;align-items:stretch}
#M3 .area{padding:6px 28px 36px}
#M3 .lado{background:var(--zona);padding:24px 28px;min-height:calc(100vh - 96px)}
#M3 .pen{background:var(--base)}
#M3 .aviso{background:var(--ouro-luz)}

/* ============================================================
   M4 · PENDÊNCIAS PRIMEIRO
   Inverte a prioridade: o que você tem para fazer abre a tela,
   em cartões largos, e os aplicativos descem para uma tira de
   ícones compacta embaixo. Para quem entende o Hub como painel
   de trabalho, e não como menu de atalhos.
   ============================================================ */
#M4 .topo-pen{padding:0 34px 22px}
#M4 .grade-pen{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:9px}
#M4 .avisos-linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:14px}
#M4 .apps{background:var(--zona);border-radius:18px 18px 0 0;padding:22px 34px 34px;margin-top:6px}
#M4 .item:hover{background:var(--base)}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 6</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Pendências com peso · saudação no relógio · marca à mostra</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos6.js"></script>
</body>
</html>
