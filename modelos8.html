<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menos na tela · rodada 8 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 8 — menos coisa na tela

   Modelo 1 (coleções por tarefa) mantido. O que muda é QUANTO
   aparece de uma vez.

   Por que agora escondo, se a pesquisa dizia "largo vence
   profundo": aquela regra vale quando todas as opções têm
   chance parecida de serem escolhidas. Não é o caso aqui.
   Metade desta lista é órgão de governo que se abre uma vez por
   mês. Deixar os 37 com o mesmo peso cobra de todo mundo, todo
   dia, o preço de dez links raros.

   A regra que passa a valer no lugar: o que se usa toda semana
   fica à vista; o que se usa uma vez por mês fica a um clique.
   Nada some — some o PESO.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#eef1f6; --zona:#ffffff;
  --fio:#dfe5ee; --fio-2:#cdd6e3;
  --navy:#101a2b;
  --txt:#101a2b; --txt-2:#4a5d78; --txt-3:#78899f;
  --ouro:#96762b; --ouro-luz:#f6efdd; --ouro-vivo:#c99a2e;
  --alerta:#c0453a; --alerta-luz:#fdeceb;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     background:var(--base);color:var(--txt);min-height:100vh}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#0c1420;border-bottom:1px solid #1d2839;
         padding:11px 20px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:8px 15px;border-radius:9px;font-size:13px;font-weight:620;
       background:#132033;border:1px solid #22304a;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#1a2b42;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.escolha__n{font-size:12px;color:#657ba0;margin-left:auto}

.modelo{display:none;min-height:100vh}
.modelo.ativo{display:block}

/* ---------- quadro fixo ---------- */
.cab{display:flex;align-items:center;gap:20px;padding:18px 34px}
.marca__img{height:52px;width:auto}
.agora{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none;
       background:var(--zona);border-radius:14px;padding:10px 18px}
.agora__hora{font-family:ui-monospace,Consolas,monospace;font-size:23px;font-weight:700;
             line-height:1;color:var(--navy);letter-spacing:-.02em}
.agora__data{font-size:11.5px;color:var(--txt-3);margin-top:4px}
.agora__risco{width:1px;align-self:stretch;background:var(--fio)}
.agora__ola{font-size:15px;font-weight:640;color:var(--navy);line-height:1.2}
.agora__nota{font-size:11.5px;color:var(--txt-2);margin-top:3px}
.agora__nota b{color:var(--alerta);font-weight:700}

.corpo{display:grid;grid-template-columns:1fr 420px;align-items:start}
.area{padding:6px 30px 40px;min-width:0}
.trilho{background:var(--base);border-left:1px solid var(--fio);padding:22px 26px;
        min-height:calc(100vh - 96px)}
.zona__cab{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.zona__t{font-size:16px;font-weight:730;color:var(--navy)}
.zona__n{font-size:12.5px;color:var(--txt-3)}
.zona__n b{color:var(--alerta)}
.pen{display:flex;gap:14px;padding:14px;border-radius:13px;background:var(--zona);
     align-items:flex-start;margin-bottom:8px}
.pen__faixa{width:4px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__faixa{background:var(--alerta)}
.pen--hoje .pen__faixa{background:var(--ouro-vivo)}
.pen__prazo{flex:none;width:44px;text-align:center}
.pen__dia{font-family:ui-monospace,Consolas,monospace;font-size:19px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__mes{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__dia{color:var(--alerta)}
.pen--hoje .pen__dia{color:var(--ouro)}
.pen__oque{font-size:14px;font-weight:640;line-height:1.35}
.pen__quem{font-size:12px;color:var(--txt-3);margin-top:4px}
.pen__sel{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
          padding:3px 9px;border-radius:99px;margin-left:auto;flex:none;white-space:nowrap}
.pen--atrasada .pen__sel{background:var(--alerta-luz);color:var(--alerta)}
.pen--hoje .pen__sel{background:var(--ouro-luz);color:var(--ouro)}
.aviso{display:flex;gap:11px;padding:12px 14px;border-radius:11px;background:var(--zona);
       margin-bottom:7px;align-items:flex-start}
.aviso__p{width:7px;height:7px;border-radius:50%;background:var(--ouro-vivo);flex:none;margin-top:5px}
.aviso__t{font-size:13px;font-weight:660;color:var(--navy)}
.aviso__x{font-size:12px;color:var(--txt-2);margin-top:2px}

/* ---------- peças dos aplicativos ---------- */
.rot{font-size:10.5px;font-weight:730;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.ico{border-radius:11px;background:#fff;border:1px solid var(--fio);display:grid;place-items:center;
     overflow:hidden;flex:none}
.ico img{object-fit:contain}
.ico--sigla{background:linear-gradient(150deg,#e6bd5c,#b98a2a);color:#191203;font-weight:780;border:0}

.quadros{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.quadro{background:var(--zona);border-radius:16px;padding:17px 19px}
.quadro__rot{margin-bottom:4px}
.quadro__sub{font-size:11.5px;color:var(--txt-3);margin-bottom:14px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:15px 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
     padding:5px 2px;border-radius:11px;transition:background .14s}
.app:hover{background:var(--base)}
.app .ico{width:38px;height:38px}
.app .ico img{width:26px;height:26px}
.app .ico--sigla{font-size:13px}
.app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}

/* o "+N": ocupa o lugar de um ícone e abre o resto ali mesmo */
.mais{display:flex;flex-direction:column;align-items:center;gap:8px;padding:5px 2px;border-radius:11px;
      transition:background .14s}
.mais:hover{background:var(--base)}
.mais__c{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
         background:var(--base);border:1px dashed var(--fio-2);color:var(--txt-2);
         font-size:12.5px;font-weight:730}
.mais__n{font-size:10.5px;font-weight:600;color:var(--txt-3)}

/* pastilha miúda, para o que é raro */
.tira{display:flex;flex-wrap:wrap;gap:6px}
.past{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;border-radius:99px;
      background:var(--base);transition:filter .14s}
.past:hover{filter:brightness(.965)}
.past .ico{width:19px;height:19px;border-radius:6px}
.past .ico img{width:13px;height:13px}
.past .ico--sigla{font-size:7.5px}
.past__n{font-size:12px;font-weight:580;color:var(--txt-2);white-space:nowrap}

/* ============================================================
   L3 · a gaveta que abre por cima
   ============================================================ */
.abre{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
      background:var(--zona);border-radius:16px;padding:17px 19px;transition:box-shadow .15s}
.abre:hover{box-shadow:0 8px 20px rgba(16,26,43,.09)}
.abre__c{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;
         background:var(--navy);color:#e0b44c;font-size:15px;font-weight:730}
.abre__t{font-size:14px;font-weight:660;color:var(--navy)}
.abre__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.abre__seta{margin-left:auto;color:var(--txt-3);font-size:19px;flex:none}

.painel-flutuante{position:fixed;inset:0;z-index:80;display:none;place-items:center;
                  background:rgba(16,26,43,.42);padding:30px}
.painel-flutuante.on{display:grid}
.painel-flutuante__caixa{background:var(--zona);border-radius:20px;padding:24px 26px;
                         max-width:820px;width:100%;max-height:80vh;overflow:auto}
.painel-flutuante__cab{display:flex;align-items:center;margin-bottom:16px}
.painel-flutuante__t{font-size:17px;font-weight:730;color:var(--navy)}
.painel-flutuante__x{margin-left:auto;font-size:22px;color:var(--txt-3);line-height:1;padding:0 6px}
.painel-flutuante__x:hover{color:var(--navy)}
.painel-flutuante .grupo + .grupo{margin-top:20px}
.painel-flutuante .rot{margin-bottom:10px;display:block}

/* ============================================================
   L4 · essencial + busca
   ============================================================ */
#L4 .busca{display:flex;align-items:center;gap:10px;background:var(--zona);border-radius:12px;
           padding:12px 16px;margin-bottom:18px;max-width:420px}
#L4 .busca input{border:0;outline:0;background:none;flex:1;font-size:14px;color:var(--txt)}
#L4 .busca svg{width:16px;height:16px;color:var(--txt-3);flex:none}
#L4 .achados{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;
             margin-bottom:20px}
#L4 .achado{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--zona)}
#L4 .achado:hover{box-shadow:0 6px 14px rgba(16,26,43,.10)}
#L4 .achado .ico{width:28px;height:28px;border-radius:8px}
#L4 .achado .ico img{width:19px;height:19px}
#L4 .achado .ico--sigla{font-size:10px}
#L4 .achado__n{font-size:12.5px;font-weight:620}
#L4 .dica{font-size:12px;color:var(--txt-3);margin-bottom:20px}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Rodada 8</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Modelo 1 · escondendo cada vez mais</span>
</div>

<div id="palco"></div>

<div class="painel-flutuante" id="flutuante">
  <div class="painel-flutuante__caixa">
    <div class="painel-flutuante__cab">
      <span class="painel-flutuante__t" id="flutuante-t"></span>
      <button class="painel-flutuante__x" type="button" id="flutuante-x" aria-label="Fechar">×</button>
    </div>
    <div id="flutuante-corpo"></div>
  </div>
</div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos8.js"></script>
</body>
</html>
