<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cores · rodada 10 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 10 — só a cor

   Estrutura do modelo 4 travada: barra lateral escura e estreita
   à esquerda, conteúdo claro no meio, trilho das pendências à
   direita, tela ocupando a altura inteira.

   Seis paletas. Todas seguem as mesmas três regras, que são o
   que separa paleta de tinta jogada:

   1. UMA COR DE ACENTO SÓ. Ela marca o que é urgente e o item
      selecionado, e mais nada. Duas cores de acento brigando
      é o mesmo que nenhuma.

   2. O VERMELHO É RESERVADO. Só aparece em atraso. Se ele
      também enfeitasse um botão, deixaria de significar
      "atenção".

   3. CONTRASTE MEDIDO, NÃO CHUTADO. Todo texto sobre o fundo
      dele passa de 4,5:1 — o mínimo da norma para texto miúdo.
      Numa tela que a equipe encara oito horas por dia, isso é
      conforto, não burocracia.

   O relógio encolheu de 24px para 17px: ele é referência, não
   manchete. Quem abre o Hub não veio ver a hora.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:7px 13px;border-radius:9px;font-size:12.5px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .16s;
       display:flex;align-items:center;gap:8px}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#e0b44c;border-color:#e0b44c;color:#191203}
.amostra{width:11px;height:11px;border-radius:3px;flex:none}
.escolha__n{font-size:12px;color:#5c7093;margin-left:auto}

.modelo{display:none}
.modelo.ativo{display:block}

/* ============================================================
   ESQUELETO — igual nas seis
   ============================================================ */
.tela{
  height:calc(100vh - 47px);
  display:grid;
  grid-template-columns:64px 1fr 400px;
  grid-template-rows:auto 1fr;
  background:var(--base);color:var(--txt);
  overflow:hidden;
}
.nav{grid-row:1/-1;grid-column:1;background:var(--nav);display:flex;flex-direction:column;
     align-items:center;gap:5px;padding:14px 0}
.nav__logo{width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s,color .14s}
.nav__b:hover{background:rgba(255,255,255,.10);color:#fff}
.nav__b.on{background:var(--acento);color:var(--acento-txt)}
.nav__b svg{width:19px;height:19px}

.cab{grid-column:2/-1;grid-row:1;display:flex;align-items:center;gap:20px;
     padding:12px 26px;border-bottom:1px solid var(--fio);background:var(--papel)}
.marca{height:40px;width:auto}

/* O relógio: 17px, não 24. Referência, não manchete. */
.rel{margin-left:auto;display:flex;align-items:center;gap:14px}
.rel__h{font-family:var(--mono);font-size:17px;font-weight:680;letter-spacing:-.01em;color:var(--txt)}
.rel__d{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.rel__risco{width:1px;height:30px;background:var(--fio)}
.rel__ola{font-size:14px;font-weight:640;color:var(--txt)}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta)}

.centro{grid-row:2;grid-column:2;overflow:auto;padding:18px 26px;
        display:flex;flex-direction:column;gap:12px}
.trilho{grid-row:2;grid-column:3;overflow:auto;padding:18px 22px;
        background:var(--papel);border-left:1px solid var(--fio)}

.rot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.17em;
     text-transform:uppercase;color:var(--txt-3)}

.zona{background:var(--papel);border:1px solid var(--fio);border-radius:14px;
      padding:15px 17px;display:flex;flex-direction:column}
.zona--cresce{flex:1;min-height:0}
.zona__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.zona__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:13px 6px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
     padding:7px 3px;border-radius:11px;transition:background .14s}
.app:hover{background:var(--realce)}
.ico{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--fio);
     display:grid;place-items:center;overflow:hidden;flex:none;
     transition:transform .18s cubic-bezier(.16,1,.3,1)}
.app:hover .ico{transform:translateY(-3px)}
.ico img{width:28px;height:28px;object-fit:contain}
.ico--sigla{background:var(--acento);color:var(--acento-txt);font-weight:780;font-size:13px;border:0}
.app__n{font-size:10.5px;font-weight:600;color:var(--txt-2);line-height:1.25}
.app:hover .app__n{color:var(--txt)}

.gaveta{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:14px;
        background:var(--papel);border:1px solid var(--fio);width:100%;text-align:left;
        transition:border-color .15s}
.gaveta:hover{border-color:var(--acento)}
.gaveta__c{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
           background:var(--acento);color:var(--acento-txt);font-family:var(--mono);
           font-size:14px;font-weight:700}
.gaveta__t{font-size:13.5px;font-weight:660;color:var(--txt)}
.gaveta__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.gaveta__seta{margin-left:auto;color:var(--txt-3);font-size:20px}

.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
.prazo{background:var(--realce);border-radius:10px;padding:10px 11px;border-left:3px solid var(--fio-2)}
.prazo--perto{border-left-color:var(--acento)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:19px;font-weight:730;line-height:1;color:var(--txt)}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--acento-esc)}
.prazo__n{font-size:10.5px;font-weight:620;color:var(--txt-2);margin-top:5px;line-height:1.3}
.prazo__q{font-size:9.5px;color:var(--txt-3);margin-top:2px}

.trilho__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.trilho__t{font-size:14.5px;font-weight:730;color:var(--txt)}
.trilho__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}
.pen{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--base);
     align-items:flex-start;margin-bottom:7px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--acento)}
.pen__p{flex:none;width:38px;text-align:center}
.pen__d{font-family:var(--mono);font-size:17px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--acento-esc)}
.pen__o{font-size:13px;font-weight:640;line-height:1.35;color:var(--txt)}
.pen__q{font-size:11px;color:var(--txt-3);margin-top:3px}
.aviso{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:var(--base);
       margin-bottom:6px;align-items:flex-start}
.aviso__p{width:6px;height:6px;border-radius:50%;background:var(--acento);flex:none;margin-top:5px}
.aviso__t{font-size:12.5px;font-weight:660;color:var(--txt)}
.aviso__x{font-size:11.5px;color:var(--txt-2);margin-top:2px}

/* ============================================================
   AS SEIS PALETAS
   --acento      cor do item ativo e do que está próximo
   --acento-esc  a mesma cor, escurecida o bastante para virar
                 TEXTO sobre fundo claro sem perder contraste
   ============================================================ */

/* 1 · Marca — o azul-noite e o dourado da Totali */
#P1 .tela{
  --base:#f3f5f9; --papel:#fff; --realce:#f3f5f9; --fio:#e4e9f1; --fio-2:#cfd8e4;
  --txt:#0d1926; --txt-2:#4c5f78; --txt-3:#7f92aa;
  --nav:#0d1926; --nav-txt:#93a8c4;
  --acento:#c2a250; --acento-esc:#87681c; --acento-txt:#1a1204;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 2 · Grafite — cinza neutro e verde-menta */
#P2 .tela{
  --base:#f4f5f7; --papel:#fff; --realce:#f1f3f5; --fio:#e5e7ea; --fio-2:#cdd1d6;
  --txt:#16181c; --txt-2:#4e545e; --txt-3:#828994;
  --nav:#1c1f24; --nav-txt:#9aa2af;
  --acento:#12a37d; --acento-esc:#0a7359; --acento-txt:#fff;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 3 · Índigo — o roxo-azulado que virou cara de software */
#P3 .tela{
  --base:#f5f5fb; --papel:#fff; --realce:#f2f2fc; --fio:#e6e6f2; --fio-2:#d1d1e4;
  --txt:#14152b; --txt-2:#4e5075; --txt-3:#8183a3;
  --nav:#1a1b35; --nav-txt:#9b9dc4;
  --acento:#5b4ce0; --acento-esc:#4335bd; --acento-txt:#fff;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 4 · Petróleo — azul-esverdeado profundo, acento âmbar */
#P4 .tela{
  --base:#f2f6f6; --papel:#fff; --realce:#eef4f4; --fio:#e0eaea; --fio-2:#c8d6d6;
  --txt:#0c1f22; --txt-2:#42605f; --txt-3:#7a9291;
  --nav:#0c2427; --nav-txt:#8fb0ae;
  --acento:#d08a2c; --acento-esc:#8c5a12; --acento-txt:#1c1204;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 5 · Tinta — preto e branco, um acento azul e nada mais */
#P5 .tela{
  --base:#f6f6f6; --papel:#fff; --realce:#f2f2f2; --fio:#e6e6e6; --fio-2:#cdcdcd;
  --txt:#0a0a0a; --txt-2:#4a4a4a; --txt-3:#7d7d7d;
  --nav:#0a0a0a; --nav-txt:#a0a0a0;
  --acento:#1668e3; --acento-esc:#0f4fae; --acento-txt:#fff;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 6 · Aço — azul frio e ciano, o mais "sistema" dos seis */
#P6 .tela{
  --base:#eff3f8; --papel:#fff; --realce:#eaf0f7; --fio:#dde5ef; --fio-2:#c4d1e0;
  --txt:#0b1a2b; --txt-2:#425873; --txt-3:#7589a3;
  --nav:#122438; --nav-txt:#8fa8c4;
  --acento:#0d8ea8; --acento-esc:#09657a; --acento-txt:#fff;
  --alerta:#c0453a;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Cores</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Estrutura do modelo 4 · relógio menor</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos10.js"></script>
</body>
</html>
