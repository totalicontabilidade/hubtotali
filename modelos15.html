<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrumação e cor · rodada 15 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 15 — dois seletores, para você combinar

   Em cima há DUAS fileiras de botões, e elas são independentes:
   uma escolhe a ARRUMAÇÃO dos sistemas, a outra escolhe a COR.
   Seis arrumações vezes cinco cores dão trinta telas possíveis —
   e você vê qualquer uma sem eu ter que adivinhar qual par
   tentar.

   FIXO NAS TRINTA: o item não tem moldura nem preenchimento (o
   modelo 1 da rodada passada) e NÃO TEM MAIS SUBTÍTULO. Só ícone
   e nome.

   SOBRE TIRAR O SUBTÍTULO: some a explicação do que cada sistema
   faz, o que pesa para quem é novo na equipe. Em troca, a linha
   fica com metade da altura e o nome ganha o peso todo. Para uma
   tela que se abre trinta vezes por dia, quem já sabe o que é o
   e-CAC não precisa que ela repita todo dia.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e;color:#0d1926}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:9px 20px}
.linha-esc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:3px 0}
.escolha__t{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
            color:#7f93b3;width:96px;flex:none}
.opcao{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .15s;
       display:flex;align-items:center;gap:7px}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#dbe6f5;border-color:#dbe6f5;color:#0d1926}
.amostra{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.25)}

.modelo{display:none}
.modelo.ativo{display:block}

/* ============================================================
   AS CINCO CORES
   Todas saem do azul da logo. A diferença é o quanto ele clareia
   e se o dourado entra ou não.

   --marca   a cor de identidade: barra lateral, quadradinho de
             iniciais, borda que acende
   --estado  a cor de "para hoje" — nunca a mesma da marca, senão
             uma cor estaria dizendo duas coisas
   ============================================================ */

/* 1 · Só azul-noite — sem dourado nenhum */
.c1{--base:#eef1f6;--fio:#dde4ee;--fio-2:#c6d1e0;
    --txt:#0d1926;--txt-2:#4a5d76;--txt-3:#7c8ea8;
    --marca:#0d1926;--marca-txt:#fff;--nav:#0d1926;--nav-txt:#8ea5c2;
    --estado:#2c5a8f;--estado-luz:#e6edf6;
    --brilho-a:rgba(13,25,38,.10);--brilho-b:rgba(44,90,143,.14)}

/* 2 · Azul-noite com dourado — o dourado só no estado */
.c2{--base:#eff1f5;--fio:#dfe4ec;--fio-2:#c8d2df;
    --txt:#0d1926;--txt-2:#4a5d76;--txt-3:#7c8ea8;
    --marca:#0d1926;--marca-txt:#c2a250;--nav:#0d1926;--nav-txt:#a9b9cd;
    --estado:#8a6a1c;--estado-luz:#f6efdd;
    --brilho-a:rgba(194,162,80,.16);--brilho-b:rgba(13,25,38,.10)}

/* 3 · Azul médio — o azul da logo clareado, mais respirável */
.c3{--base:#eef2f8;--fio:#dbe3ef;--fio-2:#c2cfe2;
    --txt:#122744;--txt-2:#46607f;--txt-3:#7a8fac;
    --marca:#1c3f6e;--marca-txt:#fff;--nav:#1c3f6e;--nav-txt:#9db6d4;
    --estado:#2f6fae;--estado-luz:#e5eef8;
    --brilho-a:rgba(28,63,110,.14);--brilho-b:rgba(47,111,174,.16)}

/* 4 · Azul-aço — o mais vivo dos cinco, ainda dentro da família */
.c4{--base:#edf2f8;--fio:#d9e3ef;--fio-2:#bfd0e3;
    --txt:#0f2338;--txt-2:#3f5d7d;--txt-3:#758ba6;
    --marca:#14507f;--marca-txt:#fff;--nav:#123f66;--nav-txt:#9cbbd8;
    --estado:#0f7fae;--estado-luz:#e2f1f8;
    --brilho-a:rgba(20,80,127,.16);--brilho-b:rgba(15,127,174,.16)}

/* 5 · Azul-noite com ciano — o mais técnico */
.c5{--base:#eef2f5;--fio:#dce4ea;--fio-2:#c5d2db;
    --txt:#0d1926;--txt-2:#48606f;--txt-3:#7a8f9c;
    --marca:#0d1926;--marca-txt:#3fd0c8;--nav:#0d1926;--nav-txt:#8fa9b6;
    --estado:#0e8a86;--estado-luz:#e0f4f2;
    --brilho-a:rgba(13,25,38,.10);--brilho-b:rgba(14,138,134,.16)}

/* ---------- esqueleto ---------- */
.tela{height:calc(100vh - 76px);display:grid;grid-template-columns:64px 1fr 380px;
      grid-template-rows:auto 1fr auto;overflow:hidden;position:relative;background:var(--base)}
.tela::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(48% 54% at 12% 4%, var(--brilho-a), transparent 62%),
             radial-gradient(46% 52% at 90% 10%, var(--brilho-b), transparent 62%),
             radial-gradient(54% 58% at 60% 98%, var(--brilho-a), transparent 62%)}
.tela > *{position:relative;z-index:1}

.nav{grid-row:1/-1;grid-column:1;background:var(--nav);display:flex;flex-direction:column;
     align-items:center;gap:5px;padding:14px 0}
.nav__logo{width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s,color .14s}
.nav__b:hover{background:rgba(255,255,255,.10);color:#fff}
.nav__b.on{background:rgba(255,255,255,.15);color:#fff}
.nav__b svg{width:19px;height:19px}

.cab{grid-column:2/-1;grid-row:1;display:flex;align-items:center;gap:18px;padding:12px 24px;
     border-bottom:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.74);
     -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.marca-img{height:38px;width:auto}
.rel{margin-left:auto;display:flex;align-items:center;gap:13px}
.rel__h{font-family:var(--mono);font-size:17px;font-weight:680;color:var(--txt)}
.rel__d{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.rel__risco{width:1px;height:28px;background:var(--fio)}
.rel__ola{font-size:14px;font-weight:640;color:var(--txt)}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta,#c0453a)}

.centro{grid-column:2;grid-row:2;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.lado{grid-column:3;grid-row:2/-1;overflow:auto;padding:18px 20px;
      background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);
      backdrop-filter:blur(20px) saturate(1.4);border-left:1px solid rgba(255,255,255,.75)}
.avisos{grid-column:2;grid-row:3;display:flex;align-items:center;height:44px;padding:0 24px;
        background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
        border-top:1px solid rgba(255,255,255,.75);overflow:hidden}
.avisos__rot{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.15em;
             text-transform:uppercase;color:var(--txt-3);flex:none;margin-right:16px}
.av{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.av__p{width:5px;height:5px;border-radius:50%;background:var(--estado);flex:none;position:relative;top:-2px}
.av__t{font-size:12.5px;font-weight:640;color:var(--txt)}
.av__x{font-size:12px;color:var(--txt-3)}
.av__sep{width:1px;height:15px;background:var(--fio);margin:0 16px;flex:none}

:root{--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--alerta:#c0453a;--alerta-luz:#fbeceb}

/* pendências */
.lado__t{font-size:14px;font-weight:730;color:var(--txt)}
.faixa{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.faixa:first-of-type{margin-top:12px}
.faixa__t{font-size:11.5px;font-weight:730;letter-spacing:.04em;text-transform:uppercase}
.faixa__n{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px}
.faixa--atraso .faixa__t{color:var(--alerta)}
.faixa--atraso .faixa__n{background:var(--alerta-luz);color:var(--alerta)}
.faixa--hoje .faixa__t{color:var(--estado)}
.faixa--hoje .faixa__n{background:var(--estado-luz);color:var(--estado)}
.faixa--depois .faixa__t{color:var(--txt-3)}
.faixa--depois .faixa__n{background:var(--base);color:var(--txt-3)}
.pen{display:flex;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.55);
     align-items:flex-start;margin-bottom:7px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--estado)}
.pen__p{flex:none;width:38px;text-align:center}
.pen__d{font-family:var(--mono);font-size:17px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--estado)}
.pen__o{font-size:13px;font-weight:640;line-height:1.35;color:var(--txt)}
.pen__q{font-size:11px;color:var(--txt-3);margin-top:3px}

/* blocos */
.bloco{background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px) saturate(1.4);
       backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.8);
       border-radius:14px;padding:15px 17px;box-shadow:0 6px 22px rgba(13,25,38,.05);
       display:flex;flex-direction:column;min-height:0}
.bloco__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bloco__t{font-size:14px;font-weight:730;color:var(--txt)}
.bloco__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}

.ico{background:#fff;border:1px solid var(--fio);display:grid;place-items:center;overflow:hidden;
     flex:none;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.ico img{object-fit:contain}
.ico--sigla{background:var(--marca);color:var(--marca-txt);font-weight:780;border:0}

.gaveta{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:14px;
        background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,.8);width:100%;text-align:left;
        box-shadow:0 6px 22px rgba(13,25,38,.05);transition:border-color .15s}
.gaveta:hover{border-color:var(--marca)}
.gaveta__c{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
           background:var(--marca);color:var(--marca-txt);font-family:var(--mono);font-size:13px;font-weight:700}
.gaveta__t{font-size:13.5px;font-weight:660;color:var(--txt)}
.gaveta__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.gaveta__seta{margin-left:auto;color:var(--txt-3);font-size:20px}

.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(106px,1fr));gap:8px}
.prazo{background:rgba(255,255,255,.55);border-radius:10px;padding:10px 11px;border-left:3px solid var(--fio-2)}
.prazo--perto{border-left-color:var(--estado)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:18px;font-weight:730;line-height:1;color:var(--txt)}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--estado)}
.prazo__n{font-size:10.5px;font-weight:620;color:var(--txt-2);margin-top:5px;line-height:1.3}
.prazo__q{font-size:9.5px;color:var(--txt-3);margin-top:2px}

/* ============================================================
   AS SEIS ARRUMAÇÕES — sem moldura, sem subtítulo
   ============================================================ */
.item{display:flex;align-items:center;gap:11px;border-radius:10px;transition:background .14s}
.item:hover{background:rgba(255,255,255,.85)}
.item:hover .ico{transform:translateY(-2px)}
.item__n{font-weight:640;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* A1 · Nome ao lado, quatro colunas */
#A1 .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:3px 14px}
#A1 .item{padding:8px 9px}
#A1 .ico{width:34px;height:34px;border-radius:10px}
#A1 .ico img{width:23px;height:23px}
#A1 .ico--sigla{font-size:11.5px}
#A1 .item__n{font-size:13px}

/* A2 · Empilhado: ícone em cima, nome embaixo */
#A2 .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px 4px}
#A2 .item{flex-direction:column;gap:8px;text-align:center;padding:8px 3px}
#A2 .ico{width:44px;height:44px;border-radius:13px}
#A2 .ico img{width:29px;height:29px}
#A2 .ico--sigla{font-size:14px}
#A2 .item__n{font-size:11px;white-space:normal;line-height:1.25}

/* A3 · Compacto: seis por linha, tudo menor */
#A3 .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px 12px}
#A3 .item{padding:6px 8px;gap:9px}
#A3 .ico{width:26px;height:26px;border-radius:8px}
#A3 .ico img{width:18px;height:18px}
#A3 .ico--sigla{font-size:9.5px}
#A3 .item__n{font-size:12.5px;font-weight:600}

/* A4 · Confortável: ícone grande, nome grande, três colunas */
#A4 .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 16px}
#A4 .item{padding:11px 12px;gap:14px}
#A4 .ico{width:46px;height:46px;border-radius:14px}
#A4 .ico img{width:31px;height:31px}
#A4 .ico--sigla{font-size:15px}
#A4 .item__n{font-size:14.5px}

/* A5 · Pastilha: ícone e nome numa cápsula, em fluxo */
#A5 .grade{display:flex;flex-wrap:wrap;gap:7px}
#A5 .item{padding:7px 15px 7px 8px;border-radius:99px;background:rgba(255,255,255,.62);gap:9px}
#A5 .item:hover{background:#fff}
#A5 .ico{width:26px;height:26px;border-radius:8px}
#A5 .ico img{width:18px;height:18px}
#A5 .ico--sigla{font-size:9.5px}
#A5 .item__n{font-size:12.5px}

/* A6 · Dois blocos lado a lado */
#A6 .duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#A6 .grade{display:grid;grid-template-columns:1fr;gap:2px}
#A6 .item{padding:8px 9px}
#A6 .ico{width:32px;height:32px;border-radius:9px}
#A6 .ico img{width:22px;height:22px}
#A6 .ico--sigla{font-size:11px}
#A6 .item__n{font-size:13px}

/* ---------- responsivo, mobile first ---------- */
@media (max-width:900px){
  .tela{height:auto;min-height:calc(100vh - 76px);grid-template-columns:1fr;
        grid-template-rows:auto auto auto auto;overflow:visible;padding-bottom:64px}
  .nav{grid-row:auto;grid-column:1;position:fixed;left:0;right:0;bottom:0;top:auto;
       flex-direction:row;justify-content:space-around;align-items:center;height:60px;
       padding:0 8px;z-index:60;box-shadow:0 -2px 16px rgba(13,25,38,.18)}
  .nav__logo{display:none}
  .nav__b{width:52px;height:44px;border-radius:11px}
  .cab{grid-column:1;grid-row:1;padding:10px 16px;gap:12px;flex-wrap:wrap}
  .marca-img{height:32px}
  .lado{grid-column:1;grid-row:2;border-left:0;border-bottom:1px solid var(--fio);
        padding:14px 16px;overflow:visible}
  .centro{grid-column:1;grid-row:3;padding:14px 16px;overflow:visible;gap:10px}
  .avisos{grid-column:1;grid-row:4;padding:0 16px;overflow-x:auto}
  #A1 .grade,#A4 .grade,#A3 .grade{grid-template-columns:1fr}
  #A6 .duas{grid-template-columns:1fr}
  .agenda{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}
@media (max-width:420px){
  .cab{padding:9px 13px}.marca-img{height:28px}
  .centro,.lado{padding:12px 13px}.avisos{padding:0 13px}
  .agenda{grid-template-columns:1fr 1fr}
  #A2 .grade{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
}
</style>
</head>
<body>

<div class="escolha">
  <div class="linha-esc">
    <span class="escolha__t">Arrumação</span>
    <div id="botoes-arr" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="linha-esc">
    <span class="escolha__t">Cor</span>
    <div id="botoes-cor" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos15.js"></script>
</body>
</html>
