<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartões · rodada 14 · Hub Totali</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<style>
/* ============================================================
   RODADA 14 — o cartão sem preenchimento, e o azul-noite

   Layout do modelo 6 travado: ícone, nome e legenda em três
   colunas. Varia só COMO o cartão se apresenta — de "sem cartão
   nenhum" até "borda fina e nada mais".

   A COR: o azul vivo saiu, entrou o azul-noite da Totali
   (#0d1926). Isso obrigou uma decisão: com o azul-noite virando
   a cor principal, ele não pode ao mesmo tempo marcar "para
   hoje" — seria a mesma cor dizendo duas coisas. Então o estado
   "hoje" ganhou um azul-aço mais claro (#2c5a8f), da mesma
   família, e o vermelho continua reservado ao atraso.

   Uma cor de marca, uma de estado, uma de alerta. Três, e cada
   uma com um trabalho só.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
:root{
  --base:#eef1f6; --papel:#fff; --realce:#f4f6fa; --fio:#dde4ee; --fio-2:#c6d1e0;
  --txt:#0d1926; --txt-2:#4a5d76; --txt-3:#7c8ea8;
  --nav:#0d1926; --nav-txt:#8ea5c2;
  --acento:#0d1926; --acento-luz:#e7ecf3; --acento-txt:#fff;
  --estado:#2c5a8f; --estado-luz:#e6edf6;
  --alerta:#c0453a; --alerta-luz:#fbeceb;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
body{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
     min-height:100vh;background:#05080e;color:var(--txt)}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{text-decoration:none;color:inherit}

.escolha{position:sticky;top:0;z-index:100;background:#05080e;border-bottom:1px solid #1a2436;
         padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.escolha__t{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7f93b3}
.opcao{padding:7px 14px;border-radius:9px;font-size:12.5px;font-weight:620;
       background:#101a2c;border:1px solid #1f2c44;color:#a6b9d6;transition:all .16s}
.opcao:hover{background:#17243a;color:#eaf1fa}
.opcao[aria-pressed="true"]{background:#c2a250;border-color:#c2a250;color:#191203}
.escolha__n{font-size:12px;color:#5c7093;margin-left:auto}

.modelo{display:none}
.modelo.ativo{display:block}

/* ---------- esqueleto ---------- */
.tela{height:calc(100vh - 47px);display:grid;grid-template-columns:64px 1fr 380px;
      grid-template-rows:auto 1fr auto;overflow:hidden;position:relative;background:var(--base)}
.tela::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(48% 54% at 12% 4%, rgba(13,25,38,.10), transparent 62%),
    radial-gradient(46% 52% at 90% 10%, rgba(44,90,143,.14), transparent 62%),
    radial-gradient(54% 58% at 60% 98%, rgba(13,25,38,.07), transparent 62%)}
.tela > *{position:relative;z-index:1}

.nav{grid-row:1/-1;grid-column:1;background:var(--nav);display:flex;flex-direction:column;
     align-items:center;gap:5px;padding:14px 0}
.nav__logo{width:32px;height:32px;object-fit:contain;margin-bottom:12px}
.nav__b{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
        color:var(--nav-txt);transition:background .14s,color .14s}
.nav__b:hover{background:rgba(255,255,255,.10);color:#fff}
.nav__b.on{background:rgba(255,255,255,.14);color:#fff}
.nav__b svg{width:19px;height:19px}

.cab{grid-column:2/-1;grid-row:1;display:flex;align-items:center;gap:18px;padding:12px 24px;
     border-bottom:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.74);
     -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.marca{height:38px;width:auto}
.rel{margin-left:auto;display:flex;align-items:center;gap:13px}
.rel__h{font-family:var(--mono);font-size:17px;font-weight:680}
.rel__d{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.rel__risco{width:1px;height:28px;background:var(--fio)}
.rel__ola{font-size:14px;font-weight:640}
.rel__sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.rel__sub b{color:var(--alerta)}

.centro{grid-column:2;grid-row:2;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.lado{grid-column:3;grid-row:2/-1;overflow:auto;padding:18px 20px;
      background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);
      backdrop-filter:blur(20px) saturate(1.4);border-left:1px solid rgba(255,255,255,.75)}
.avisos{grid-column:2;grid-row:3;display:flex;align-items:center;height:44px;padding:0 24px;
        background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
        border-top:1px solid rgba(255,255,255,.75);overflow:hidden}
.avisos__rot{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.15em;
             text-transform:uppercase;color:var(--txt-3);flex:none;margin-right:16px}
.av{display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
.av__p{width:5px;height:5px;border-radius:50%;background:var(--estado);flex:none;position:relative;top:-2px}
.av__t{font-size:12.5px;font-weight:640}
.av__x{font-size:12px;color:var(--txt-3)}
.av__sep{width:1px;height:15px;background:var(--fio);margin:0 16px;flex:none}

/* pendências */
.lado__t{font-size:14px;font-weight:730}
.faixa{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.faixa:first-of-type{margin-top:12px}
.faixa__t{font-size:11.5px;font-weight:730;letter-spacing:.04em;text-transform:uppercase}
.faixa__n{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px}
.faixa--atraso .faixa__t{color:var(--alerta)}
.faixa--atraso .faixa__n{background:var(--alerta-luz);color:var(--alerta)}
.faixa--hoje .faixa__t{color:var(--estado)}
.faixa--hoje .faixa__n{background:var(--estado-luz);color:var(--estado)}
.faixa--depois .faixa__t{color:var(--txt-3)}
.faixa--depois .faixa__n{background:var(--base);color:var(--txt-3)}
.pen{display:flex;gap:12px;padding:12px;border-radius:12px;background:rgba(238,241,246,.8);
     align-items:flex-start;margin-bottom:7px}
.pen__f{width:3px;border-radius:99px;align-self:stretch;background:var(--fio-2);flex:none}
.pen--atrasada .pen__f{background:var(--alerta)}
.pen--hoje .pen__f{background:var(--estado)}
.pen__p{flex:none;width:38px;text-align:center}
.pen__d{font-family:var(--mono);font-size:17px;font-weight:730;line-height:1;color:var(--txt-2)}
.pen__m{font-size:8.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--txt-3);margin-top:4px}
.pen--atrasada .pen__d{color:var(--alerta)}
.pen--hoje .pen__d{color:var(--estado)}
.pen__o{font-size:13px;font-weight:640;line-height:1.35}
.pen__q{font-size:11px;color:var(--txt-3);margin-top:3px}

/* blocos e peças */
.rot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.17em;
     text-transform:uppercase;color:var(--txt-3)}
.bloco{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);
       backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.8);
       border-radius:14px;padding:15px 17px;box-shadow:0 6px 22px rgba(13,25,38,.05);
       display:flex;flex-direction:column;min-height:0}
.bloco__cab{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.bloco__t{font-size:14px;font-weight:730}
.bloco__n{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-left:auto}

.ico{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--fio);
     display:grid;place-items:center;overflow:hidden;flex:none;
     transition:transform .18s cubic-bezier(.16,1,.3,1)}
.ico img{width:27px;height:27px;object-fit:contain}
.ico--sigla{background:var(--acento);color:var(--acento-txt);font-weight:780;font-size:13px;border:0}

/* A grade é a mesma nas seis: três colunas, ícone, nome, legenda.
   Só o vestido de cada item muda. */
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:var(--vao,9px)}
.item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:12px;
      transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.item:hover .ico{transform:translateY(-2px)}
.item__n{font-size:13.5px;font-weight:660}
.item__x{font-size:11px;color:var(--txt-3);margin-top:2px}

.gaveta{display:flex;align-items:center;gap:13px;padding:13px 16px;border-radius:14px;
        background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,.8);width:100%;text-align:left;
        box-shadow:0 6px 22px rgba(13,25,38,.05);transition:border-color .15s}
.gaveta:hover{border-color:var(--acento)}
.gaveta__c{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
           background:var(--acento);color:var(--acento-txt);font-family:var(--mono);font-size:13px;font-weight:700}
.gaveta__t{font-size:13.5px;font-weight:660}
.gaveta__s{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.gaveta__seta{margin-left:auto;color:var(--txt-3);font-size:20px}

.agenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(106px,1fr));gap:8px}
.prazo{background:rgba(238,241,246,.75);border-radius:10px;padding:10px 11px;border-left:3px solid var(--fio-2)}
.prazo--perto{border-left-color:var(--estado)}
.prazo--hoje{border-left-color:var(--alerta)}
.prazo__d{font-family:var(--mono);font-size:18px;font-weight:730;line-height:1}
.prazo--hoje .prazo__d{color:var(--alerta)}
.prazo--perto .prazo__d{color:var(--estado)}
.prazo__n{font-size:10.5px;font-weight:620;color:var(--txt-2);margin-top:5px;line-height:1.3}
.prazo__q{font-size:9.5px;color:var(--txt-3);margin-top:2px}

/* ============================================================
   OS SEIS VESTIDOS DO ITEM
   ============================================================ */

/* C1 · SEM NADA — só o espaço separa, como no modelo 3.
   O mais leve possível. Em compensação, sem borda o olho
   precisa do vão para entender onde um item acaba e o outro
   começa: por isso o vão aqui é maior que nos outros. */
#C1{--vao:4px}
#C1 .item{padding:10px 10px}
#C1 .item:hover{background:rgba(255,255,255,.8)}

/* C2 · SÓ BORDA — fio fino, fundo nenhum. O que você pediu:
   a forma do cartão sem o peso do preenchimento. */
#C2 .item{border:1px solid var(--fio);background:transparent}
#C2 .item:hover{border-color:var(--acento);transform:translateY(-2px)}

/* C3 · BORDA QUE ACENDE — em repouso o fio é quase invisível;
   na passagem do mouse ele vira azul-noite e o fundo aparece.
   A tela em repouso fica caladíssima e ainda assim há resposta
   ao toque. */
#C3 .item{border:1px solid rgba(13,25,38,.07);background:transparent}
#C3 .item:hover{border-color:var(--acento);background:rgba(255,255,255,.85);
                box-shadow:0 8px 20px rgba(13,25,38,.09)}

/* C4 · DIVISOR — nem borda nem fundo: um fio horizontal entre
   um item e outro, como extrato. Zero moldura, e mesmo assim
   cada linha tem começo e fim claros. */
#C4{--vao:0}
#C4 .grade{gap:0 22px}
#C4 .item{border-bottom:1px solid var(--fio);border-radius:0;padding:12px 4px}
#C4 .item:hover{background:rgba(255,255,255,.6)}

/* C5 · CANTO RETO — borda fina e raio pequeno. O canto
   arredondado é o que faz uma interface parecer aplicativo de
   celular; o canto quase reto é o que a faz parecer ferramenta. */
#C5 .item{border:1px solid var(--fio);border-radius:5px;background:transparent}
#C5 .item .ico{border-radius:6px}
#C5 .item:hover{border-color:var(--acento)}

/* C6 · FIO À ESQUERDA — sem moldura em volta, só um traço
   vertical no começo da linha. Marca o início sem cercar. */
#C6 .item{border-left:2px solid var(--fio-2);border-radius:0 10px 10px 0;background:transparent;
          padding-left:14px}
#C6 .item:hover{border-left-color:var(--acento);background:rgba(255,255,255,.7)}

/* ---------- responsivo, mobile first ---------- */
/* No celular a planta muda, não encolhe: a lateral vira barra
   inferior (polegar não alcança o topo de um telefone grande) e
   as zonas empilham na ordem da urgência — pendências antes dos
   sistemas, porque não há largura para as duas lado a lado. */
@media (max-width:900px){
  .tela{height:auto;min-height:calc(100vh - 47px);grid-template-columns:1fr;
        grid-template-rows:auto auto auto auto;overflow:visible;padding-bottom:64px}
  .nav{grid-row:auto;grid-column:1;position:fixed;left:0;right:0;bottom:0;top:auto;
       flex-direction:row;justify-content:space-around;align-items:center;height:60px;
       padding:0 8px;z-index:60;box-shadow:0 -2px 16px rgba(13,25,38,.18)}
  .nav__logo{display:none}
  .nav__b{width:52px;height:44px;border-radius:11px}
  .cab{grid-column:1;grid-row:1;padding:10px 16px;gap:12px;flex-wrap:wrap}
  .marca{height:32px}
  .rel{gap:10px}
  .rel__h{font-size:15px}
  .rel__risco{height:24px}
  .rel__ola{font-size:13px}
  .lado{grid-column:1;grid-row:2;border-left:0;border-bottom:1px solid var(--fio);
        padding:14px 16px;overflow:visible}
  .centro{grid-column:1;grid-row:3;padding:14px 16px;overflow:visible;gap:10px}
  .avisos{grid-column:1;grid-row:4;padding:0 16px;overflow-x:auto}
  .grade{grid-template-columns:1fr}
  #C4 .grade{gap:0}
  .agenda{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}
@media (max-width:420px){
  .cab{padding:9px 13px}
  .marca{height:28px}
  .centro,.lado{padding:12px 13px}
  .avisos{padding:0 13px}
  .agenda{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="escolha">
  <span class="escolha__t">Cartões</span>
  <div id="botoes" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  <span class="escolha__n">Layout do 6 · azul-noite · varia só o vestido do item</span>
</div>

<div id="palco"></div>

<script src="js/sistemas.js"></script>
<script src="js/logos.js"></script>
<script src="js/modelos14.js"></script>
</body>
</html>
